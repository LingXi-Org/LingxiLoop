<section id="goal-boundary" style="background:#f5f4ed;color:#141413;font-family:system-ui, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:space-between;gap:48px">
<p style="font-size:36px;font-weight:500;line-height:1.2;color:#73726c">TCP 可靠传输 · 1 / 6</p>
<h2 style="font-family:Georgia, serif;font-size:72px;font-weight:300;line-height:1.2">先看目标与边界</h2>
<p style="font-size:44px;font-weight:400;line-height:1.4;color:#3d3d3a">TCP 把应用交下来的字节流，尽量<b>完整、按序、不重复</b>地送到对方。</p>
<div style="display:flex;flex-direction:row;gap:32px">
<div style="flex:1;display:flex;flex-direction:column;gap:16px;background:#faf9f5;padding:40px;border:1px solid #e3dacc;border-radius:16px">
<h3 style="font-family:Georgia, serif;font-size:32px;font-weight:400;line-height:1.3;color:#141413">尽力保证</h3>
<p style="font-size:32px;font-weight:400;line-height:1.4">丢包会重传、乱序会重排、重复会丢弃、损坏会被校验发现并丢弃。</p>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:16px;background:#141413;padding:40px;border-radius:16px">
<h3 style="font-family:Georgia, serif;font-size:32px;font-weight:400;line-height:1.3;color:#faf9f5">并不承诺</h3>
<p style="font-size:32px;font-weight:400;line-height:1.4;color:#e3dacc">不保证延迟上限、带宽大小，也不保证一次写入的数据一定一次到达。</p>
</div>
</div>
<p style="font-size:32px;font-weight:400;line-height:1.4;color:#141413">边界：如果重传始终不成功，TCP 最终会断开连接，而不是无期限等待。</p>
<p style="position:absolute;left:128px;bottom:64px;font-size:24px;color:#73726c">1 / 6 · TCP 可靠传输</p>
<aside>开头先明确可靠不等于快、也不等于即时：TCP 用序号、确认、重传和窗口把字节流变成可靠交付，但它只管到“字节收到且有序”，管不到业务层的时间要求。如果迟迟重传失败，它会放弃连接。</aside>
</section>
