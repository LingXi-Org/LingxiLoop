<p style="font-size:36px;font-weight:500;letter-spacing:2px;color:#d97757">第 1 页 · 目标与边界</p>
<h2 style="font-family:Georgia, serif;font-size:88px;font-weight:400;line-height:1.15">TCP 帮你把数据可靠地送达</h2>
<div style="display:flex;flex-direction:column;gap:0;background:#faf9f5;border:1px solid #e3dacc;border-radius:16px;padding:48px">
<p style="font-size:34px;line-height:1.5;padding:16px 0"><b style="font-weight:700">目标：</b>让应用层交出去的字节流，按原顺序、不重不漏地到达对端。</p>
<p style="font-size:34px;line-height:1.5;padding:16px 0;border-top:1px solid #e3dacc"><b style="font-weight:700">手段：</b>序号、确认、重传、窗口四件事配合，在不可靠的网络之上做出可靠。</p>
<p style="font-size:34px;line-height:1.5;padding:16px 0;border-top:1px solid #e3dacc"><b style="font-weight:700">边界：</b>TCP 不保证时延、不保证带宽、也不保证数据一定被应用读取。</p>
</div>
