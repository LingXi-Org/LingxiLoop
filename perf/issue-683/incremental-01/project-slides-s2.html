<p style="font-family:system-ui, sans-serif;font-size:36px;font-weight:500;letter-spacing:1px;color:#d97757;margin:0">02 · 序号与字节流</p>
<h2 style="font-size:96px;font-weight:300;line-height:1.2;margin:0">每个字节都有一个序号</h2>
<ul style="font-family:system-ui, sans-serif;font-size:32px;line-height:1.4;color:#3d3d3a;margin:0;padding-left:44px;display:flex;flex-direction:column;gap:20px">
<li>TCP 把应用写进来的数据看成一条连续的字节流，不是一条条独立的消息</li>
<li>序号以字节为单位累加，接收端据此把乱序到达的数据重新排好</li>
<li>序号用完一轮后回绕，两端按模运算比较序号的新旧</li>
</ul>

<aside>强调“字节流”而非“消息流”：应用的一次写入可能被拆成多个报文段，多次写入也可能合并进一段。序号是后面确认、重传、排序的共同坐标。</aside>
