<h2 style="font-size:96px;font-weight:300;line-height:1.15">TCP的可靠：按序、不重、不丢地交付字节流</h2>
<ul style="font-size:36px;line-height:1.6;color:#3d3d3a">
<li>目标：应用交出一串字节，收到的是<b>同一串字节</b>，不重不漏、顺序不变</li>
<li>网络本身只尽力而为：可能丢包、乱序、重复、延迟抖动</li>
<li>TCP不保证速度、低延迟，也不保证每条报文被单独送达</li>
</ul>
<p style="position:absolute;left:128px;bottom:64px;font-size:24px;color:#6a7179">第 1 页 · 目标与边界</p>
<aside>开场：问学生“浏览器里下载的文件为什么完整？”引出 TCP 把不可靠网络变可靠。强调 TCP 只承诺按字节流可靠，不承诺实时与带宽。</aside>
</section>
