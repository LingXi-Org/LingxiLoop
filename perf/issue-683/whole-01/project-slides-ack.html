<section id="ack" data-transition="fade" style="background:#faf9f5;color:#141413;font-family:'Source Serif 4',Georgia,serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:56px">
<h2 style="font-size:96px;font-weight:300;line-height:1.15">确认：告诉对方“我连到哪里了”</h2>
<ul style="font-size:36px;line-height:1.6;color:#3d3d3a">
<li>确认号（ACK）= 期望收到的<b>下一个字节</b>序号，表示之前全部已收到</li>
<li>累计确认：一个ACK顶掉多个；ACK丢失可由后来的ACK补上</li>
<li>接收方可以延迟发送ACK，但乱序或空缺通常立即重发</li>
</ul>
<div style="display:flex;flex-direction:column;gap:12px;background:#fbfbf8;padding:32px;border:1px solid #e3dacc;border-radius:16px;font-family:'Space Grotesk',sans-serif">
<p style="font-size:28px;line-height:1.5">收到 0–4 字节　→ 发 ACK=5</p>
<p style="font-size:28px;line-height:1.5">收到 5–9 字节　→ 发 ACK=10</p>
<p style="font-size:28px;line-height:1.5">只收到 10–12　→ 仍发 ACK=5，并等待 5–9</p>
</div>
<p style="position:absolute;left:128px;bottom:64px;font-size:24px;color:#6a7179">第 3 页 · 确认与累计确认</p>
<aside>提醒 ACK 号是“下一个期望”，不是“最后一个收到”，这是常见错误。累计确认意味着中间的ACK丢了通常不用重传。</aside>
</section>
