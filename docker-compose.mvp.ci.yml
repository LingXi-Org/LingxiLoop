# Standalone CI compose for the MVP smoke (issue #9, section 8: "at least one
# Compose smoke that doesn't depend on a paid model").
#
# Deliberately NOT an overlay of docker-compose.mvp.yml — Compose's merge
# semantics make it awkward to *remove* a `build:` key from an inherited
# service, and duplicating four short service blocks here is easier to read
# than debugging a merge. Keep this file's `lingxiloop` / `postgres` / `redis`
# services in sync with docker-compose.mvp.yml if you change those.
#
# CI builds the commit-pinned WuKongIM v3 server and the real Agent OS. Only
# the fake OpenAI Chat Completions provider is deterministic and free.
#
# Usage:
#   docker compose -f docker-compose.mvp.ci.yml up -d --build
#   npm run mvp:smoke -- --base-url http://localhost:5181
#   docker compose -f docker-compose.mvp.ci.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_min_error_statement=error"]
    environment:
      POSTGRES_USER: lingxiloop
      POSTGRES_PASSWORD: lingxiloop
      POSTGRES_DB: lingxiloop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxiloop -d lingxiloop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp-ci]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp-ci]

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${LINGXILOOP_R2_PORT:-9000}:9000"
    networks: [lingxiloop-mvp-ci, lingxiloop-knowledge-internal-ci]

  minio-bootstrap:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
        mc mb --ignore-existing local/lingxiloop
    networks: [lingxiloop-mvp-ci, lingxiloop-knowledge-internal-ci]

  surrealdb:
    image: surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011
    command: ["start", "--log", "warn", "--user", "open-notebook", "--pass", "ci-open-notebook-db-password", "memory"]
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [lingxiloop-knowledge-internal-ci]

  open-notebook:
    build:
      context: ./third_party/open-notebook
      target: lingxiloop-rag
    depends_on:
      surrealdb:
        condition: service_healthy
      fake-embedding-provider:
        condition: service_healthy
    environment:
      OPEN_NOTEBOOK_PASSWORD: ci-open-notebook-password
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "1"
      OPEN_NOTEBOOK_R2_PREFIX: open-notebook
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET: lingxiloop
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      OPENAI_API_KEY: ci-open-notebook-password
      OPENAI_BASE_URL: http://fake-embedding-provider:8126/v1
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: open-notebook
      SURREAL_PASSWORD: ci-open-notebook-db-password
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status rag-api | grep -q RUNNING && supervisorctl status rag-worker | grep -q RUNNING && curl -fsS http://localhost:5055/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [lingxiloop-knowledge-internal-ci, lingxiloop-knowledge-egress-ci]

  fake-openai-provider:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server/scripts/fake-openai-provider.mjs:/app/fake-openai-provider.mjs:ro
    command: ["node", "/app/fake-openai-provider.mjs"]
    environment:
      PORT: 8125
      EMBEDDING_PROXY_URL: http://fake-embedding-provider:8126/v1/embeddings
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8125/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp-ci, lingxiloop-knowledge-internal-ci]

  fake-embedding-provider:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./scripts/fake-embedding-provider.mjs:/app/fake-embedding-provider.mjs:ro
    command: ["node", "/app/fake-embedding-provider.mjs"]
    environment:
      PORT: 8126
      CONTROL_TOKEN: ci-embedding-control-token-not-for-prod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8126/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-knowledge-internal-ci, lingxiloop-knowledge-egress-ci]

  wukongim:
    build:
      context: .
      dockerfile: server/docker/wukongim.Dockerfile
      args:
        WUKONG_COMMIT: c7f663fa23a4ee2c6f7e08c68423f50f0f6e9c47
    environment:
      WK_NODE_DATA_DIR: /var/lib/wukongim
      WK_WEBHOOK_HTTP_ADDR: "http://lingxiloop:5181/webhooks/wukong?token=ci-wukong-webhook-secret"
    volumes:
      - ./server/wukongim/wukongim.toml:/etc/wukongim/wukongim.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [lingxiloop-mvp-ci]

  db-bootstrap:
    build:
      context: .
      dockerfile: server/docker/lingxiloop-server.Dockerfile
    restart: "no"
    command: ["npm", "run", "db:bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      REDIS_URL: redis://redis:6379
      WUKONG_USER_TOKEN_SECRET: ci-wukong-user-token-secret
      OPENAI_API_KEY: sk-smoke-test-not-a-real-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      LINGXILOOP_INVITE_BASE_URL: http://localhost:5181
    networks: [lingxiloop-mvp-ci]

  lingxiloop:
    build:
      context: .
      dockerfile: server/docker/lingxiloop-server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      open-notebook:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      db-bootstrap:
        condition: service_completed_successfully
    environment: &lingxiloop-environment
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: warn
      PORT: 5181
      DATABASE_URL: postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      REDIS_URL: redis://redis:6379
      LINGXILOOP_INVITE_BASE_URL: http://localhost:5181
      OPENAI_API_KEY: sk-smoke-test-not-a-real-key
      OPENAI_BASE_URL: http://fake-openai-provider:8125/v1
      OPENAI_MODEL: gpt-5-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      AGENT_OS_SERVICE_TOKEN: ci-agent-os-service-token-not-for-prod
      WUKONG_API_URL: http://wukongim:5001
      WUKONG_WS_URL: ws://localhost:5200
      WUKONG_API_TOKEN: ci-wukong-api-token
      WUKONG_WEBHOOK_SECRET: ci-wukong-webhook-secret
      WUKONG_USER_TOKEN_SECRET: ci-wukong-user-token-secret
      OPEN_NOTEBOOK_ENABLED: "true"
      OPEN_NOTEBOOK_URL: http://open-notebook:5055
      OPEN_NOTEBOOK_PASSWORD: ci-open-notebook-password
      PRESENTATION_HTML_ENABLED: "false"
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET: lingxiloop
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_PUBLIC_BASE: http://localhost:9000/lingxiloop
      R2_URL_SIGNING_SECRET: ci-r2-signing-secret-not-for-prod
    ports:
      - "${LINGXILOOP_PORT:-5181}:5181"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp-ci, lingxiloop-knowledge-internal-ci]

  worker:
    build:
      context: .
      dockerfile: server/docker/lingxiloop-server.Dockerfile
    command: ["npm", "run", "worker:start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      open-notebook:
        condition: service_healthy
    environment: *lingxiloop-environment
    networks: [lingxiloop-mvp-ci, lingxiloop-knowledge-internal-ci]

  agent-os:
    build:
      context: .
      dockerfile: server/docker/agent-os.Dockerfile
    depends_on:
      lingxiloop:
        condition: service_healthy
      fake-openai-provider:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: warn
      AGENT_OS_PORT: 5190
      AGENT_OS_MAX_CONCURRENT_RUNS: 8
      AGENT_OS_SERVICE_TOKEN: ci-agent-os-service-token-not-for-prod
      LINGXILOOP_CONTROL_PLANE_URL: http://lingxiloop:5181
      OPENAI_API_KEY: sk-smoke-test-not-a-real-key
      OPENAI_BASE_URL: http://fake-openai-provider:8125/v1
      OPENAI_MODEL: gpt-5-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5190/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp-ci]

networks:
  lingxiloop-mvp-ci: {}
  lingxiloop-knowledge-internal-ci:
    internal: true
  lingxiloop-knowledge-egress-ci: {}
