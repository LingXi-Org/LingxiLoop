# Standalone CI compose for the MVP smoke (issue #9, section 8: "at least one
# Compose smoke that doesn't depend on a paid model").
#
# Deliberately NOT an overlay of docker-compose.mvp.yml — Compose's merge
# semantics make it awkward to *remove* a `build:` key from an inherited
# service, and duplicating four short service blocks here is easier to read
# than debugging a merge. Keep this file's `lingxiloop` / `postgres` / `redis`
# services in sync with docker-compose.mvp.yml if you change those.
#
# CI builds the commit-pinned WuKongIM v3 server and the real Agent OS. Only
# the DeepSeek Chat Completions-compatible model provider is deterministic and free.
#
# Usage:
#   docker compose -f docker-compose.mvp.ci.yml up -d --build
#   npm run mvp:smoke -- --base-url http://localhost:5181
#   docker compose -f docker-compose.mvp.ci.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_min_error_statement=error"]
    environment:
      POSTGRES_USER: lingxiloop
      POSTGRES_PASSWORD: lingxiloop
      POSTGRES_DB: lingxiloop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxiloop -d lingxiloop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp-ci]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp-ci]

  fake-deepseek-provider:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server/scripts/fake-deepseek-provider.mjs:/app/fake-deepseek-provider.mjs:ro
    command: ["node", "/app/fake-deepseek-provider.mjs"]
    environment:
      PORT: 8125
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8125/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp-ci]

  wukongim:
    build:
      context: .
      dockerfile: server/docker/wukongim.Dockerfile
      args:
        WUKONG_COMMIT: c7f663fa23a4ee2c6f7e08c68423f50f0f6e9c47
    environment:
      WK_NODE_DATA_DIR: /var/lib/wukongim
    volumes:
      - ./server/wukongim/wukongim.toml:/etc/wukongim/wukongim.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [lingxiloop-mvp-ci]

  lingxiloop:
    build:
      context: .
      dockerfile: server/docker/lingxiloop-server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: warn
      PORT: 5181
      DATABASE_URL: postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: sk-smoke-test-not-a-real-key
      DEEPSEEK_BASE_URL: http://fake-deepseek-provider:8125/v1
      DEEPSEEK_MODEL: deepseek-chat
      AGENT_OS_SERVICE_TOKEN: ci-agent-os-service-token-not-for-prod
      WUKONG_API_URL: http://wukongim:5001
      WUKONG_WS_URL: ws://localhost:5200
      WUKONG_API_TOKEN: ci-wukong-api-token
      WUKONG_WEBHOOK_SECRET: ci-wukong-webhook-secret
      WUKONG_WEBHOOK_ALLOW_UNSIGNED_INTERNAL: "true"
    ports:
      - "${LINGXILOOP_PORT:-5181}:5181"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp-ci]

  agent-os:
    build:
      context: .
      dockerfile: server/docker/agent-os.Dockerfile
    depends_on:
      lingxiloop:
        condition: service_healthy
      fake-deepseek-provider:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: warn
      AGENT_OS_PORT: 5190
      AGENT_OS_MAX_CONCURRENT_RUNS: 4
      AGENT_OS_SERVICE_TOKEN: ci-agent-os-service-token-not-for-prod
      LINGXILOOP_CONTROL_PLANE_URL: http://lingxiloop:5181
      DEEPSEEK_API_KEY: sk-smoke-test-not-a-real-key
      DEEPSEEK_BASE_URL: http://fake-deepseek-provider:8125/v1
      DEEPSEEK_MODEL: deepseek-chat
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5190/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp-ci]

networks:
  lingxiloop-mvp-ci: {}
