name: Build images
run-name: images ${{ inputs.sha || github.sha }}

# Builds every content-tagged image (scripts/image-tag.mjs) missing from GHCR.
# Called by CI on main; `npm run deploy` dispatches it for a pushed commit.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build (default the dispatched ref)
        type: string
        default: ''

permissions:
  contents: read
  packages: write

env:
  SIGILLO_TOKEN: ${{ secrets.SIGILLO_TOKEN }}
  SIGILLO_API_URL: https://sigillo.lingxilearn.cn

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.tags.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.sha || github.sha }}" }
      - id: tags
        run: echo "images=$(node scripts/image-tag.mjs json)" >> "$GITHUB_OUTPUT"

  build:
    name: image ${{ matrix.image.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: existing
        run: |
          if docker buildx imagetools inspect "${{ matrix.image.ref }}" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.existing.outputs.found != 'true'
        uses: actions/checkout@v5
        with: { ref: "${{ inputs.sha || github.sha }}" }
      - if: steps.existing.outputs.found != 'true'
        name: Read the package token from Sigillo
        run: |
          token=$(npm exec --yes --package=sigillo@0.14.2 -- sigillo secrets get LINGXIOS_PACKAGES_TOKEN --raw --force -p 01M1TZH9C21C1A9PFAR8E41553 -c prod)
          echo "::add-mask::$token"
          echo "NPM_TOKEN=$token" >> "$GITHUB_ENV"
      - if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ matrix.image.ref }}
          build-args: |
            ${{ matrix.image.build_args }}
            LINGXILOOP_COMMIT_SHA=${{ inputs.sha || github.sha }}
          secrets: |
            npm_token=${{ env.NPM_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.image.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.package }}
