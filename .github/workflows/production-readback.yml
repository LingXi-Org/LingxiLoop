name: Production readback

on:
  schedule:
    # Independent daily readback. Feature-specific T+24 deadlines are tracked
    # by shipping_releases; the server promotes missed ones to overdue friction.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-readback:
    name: Authenticated production paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-readback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run authenticated readback
        env:
          CUMORA_SMOKE_TOKEN: ${{ secrets.CUMORA_SMOKE_TOKEN }}
          CUMORA_SMOKE_COMPANY_ID: ${{ secrets.CUMORA_SMOKE_COMPANY_ID }}
          CUMORA_SMOKE_BASE: https://api.cumora.ai
        run: node scripts/release-smoke.mjs
