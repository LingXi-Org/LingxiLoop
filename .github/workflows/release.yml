name: Web Release

# Current LingxiLoop distribution target is Web/server only.
# A v* tag validates the Web build and creates a GitHub Release in this repo.
# It deliberately does NOT build or publish Electron/mobile artifacts and does
# not deploy/mutate a running server.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate Web + server build
        run: |
          npm run typecheck
          npm run server:typecheck
          npm run build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          EXTRA=()
          if [[ "$TAG" == *-* ]]; then
            EXTRA+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "LingxiLoop $TAG" \
            --generate-notes \
            "${EXTRA[@]}"
