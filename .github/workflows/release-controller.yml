name: Release controller checks
on:
  pull_request:
    paths:
      - 'workers/release/**'
      - 'shared/release/**'
      - 'scripts/release/**'
      - 'scripts/release-host/**'
      - 'deploy/release-host/**'
      - 'scripts/mihomo/**'
      - 'deploy/mihomo/**'
      - '.github/workflows/release-controller.yml'
  push:
    branches: [main]
    paths:
      - 'workers/release/**'
      - 'shared/release/**'
      - 'scripts/release/**'
      - 'scripts/release-host/**'
      - 'deploy/release-host/**'
      - 'scripts/mihomo/**'
      - 'deploy/mihomo/**'
      - '.github/workflows/release-controller.yml'
permissions: { contents: read }
concurrency:
  group: release-controller-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: server/build/admin-control/package-lock.json
      - name: Install exact existing Worker toolchain
        run: |
          node server/scripts/scoped-dependencies.mjs
          node server/scripts/install-scoped-dependencies.mjs admin-control
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npx --no-install tsc -p workers/release/tsconfig.json --noEmit
      - run: npx --no-install vitest run --config workers/release/vitest.config.ts
      - name: Prepare isolated PostgreSQL fixture
        run: docker pull pgvector/pgvector:pg16
      - run: node --experimental-sqlite --test scripts/release/*.test.mjs scripts/release/bootstrap-host/*.test.mjs scripts/release/provision-cloudflare/*.test.mjs scripts/release-host/*.test.mjs scripts/mihomo/*.test.mjs
        env:
          RELEASE_HOST_DOCKER_TEST: '1'
          RELEASE_HOST_DOCKER_BIN: /usr/bin/docker
