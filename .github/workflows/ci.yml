name: LingxiLoop scoped CI and CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Component to verify, release production images, or run deep integration checks
        required: true
        type: choice
        options: [web, admin-control, server, open-notebook, wukongim, gateway, deployment, release, deep-integration]

concurrency:
  group: lingxiloop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  NODE_VERSION: "22"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin_build: ${{ steps.scope.outputs.admin_build }}
      integration_files: ${{ steps.scope.outputs.integration_files }}
      deep_integration: ${{ steps.scope.outputs.deep_integration }}
      open_notebook: ${{ steps.scope.outputs.open_notebook }}
      deployment: ${{ steps.scope.outputs.deployment }}
      web_build: ${{ steps.scope.outputs.web_build }}
      web_tests: ${{ steps.paths.outputs.web_tests_files }}
      admin_tests: ${{ steps.paths.outputs.admin_tests_files }}
      server_tests: ${{ steps.paths.outputs.server_tests_files }}
      web: ${{ steps.scope.outputs.web }}
      admin: ${{ steps.scope.outputs.admin }}
      control: ${{ steps.scope.outputs.control }}
      server: ${{ steps.scope.outputs.server }}
      integration: ${{ steps.scope.outputs.integration }}
      deploy_contract: ${{ steps.scope.outputs.deploy_contract }}
      control_deploy: ${{ steps.scope.outputs.control_deploy }}
      control_migrations: ${{ steps.scope.outputs.control_migrations }}
      release: ${{ steps.scope.outputs.release }}
      checks: ${{ steps.scope.outputs.checks }}
      publish: ${{ steps.scope.outputs.publish }}
      images: ${{ steps.scope.outputs.images }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: dorny/paths-filter@v4
        id: paths
        with:
          list-files: json
          predicate-quantifier: some-with-excludes
          filters: |
            shared_frontend:
              - '.npmrc'
              - 'package.json'
              - 'package-lock.json'
            lint_config:
              - 'biome.json'
            test_runner:
              - 'scripts/run-tests.mjs'
              - 'scripts/test-selectors.test.mjs'
            web:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'postcss.config.js'
              - 'tailwind.config.ts'
              - '!src/**/*.test.*'
              - '!src/**/__tests__/**'
            web_tests:
              - 'src/**/*.test.*'
            admin:
              - 'admin/**'
              - 'vite.admin.config.ts'
              - 'tsconfig.admin.json'
              - 'src/components/GlobalInteractionProvider.tsx'
              - 'src/components/ResourceSkeleton.tsx'
              - 'src/components/ui/**'
              - 'src/lib/actionToast.ts'
              - 'src/lib/confirmAction.ts'
              - '!**/*.test.*'
            admin_tests:
              - 'admin/**/*.test.*'
            control:
              - 'workers/control-plane/**'
              - 'worker-configuration.d.ts'
              - '!workers/control-plane/**/*.test.*'
              - '!workers/control-plane/vitest.config.ts'
              - '!workers/control-plane/wrangler.test.jsonc'
            control_tests:
              - 'workers/control-plane/**/*.test.*'
              - 'workers/control-plane/vitest.config.ts'
              - 'workers/control-plane/wrangler.test.jsonc'
            server:
              - 'server/tsconfig.json'
              - 'server/scripts/**'
            server_tests:
              - 'server/src/**/*.test.ts'
              - '!server/src/__integration__/**'
            server_source:
              - 'server/.npmrc'
              - 'server/src/**'
              - '!server/src/**/*.test.ts'
              - '!server/src/__tests__/**'
              - '!server/src/__integration__/**'
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'server/*.conf'
              - 'src/lib/canvasLayout.ts'
              - 'src/lib/canvasEventKinds.ts'
            integration_tests:
              - 'server/src/__integration__/*.test.ts'
            integration_runner:
              - 'server/run-integration-tests.mjs'
              - 'server/src/__integration__/**'
              - '!server/src/__integration__/*.test.ts'
            server_docker:
              - 'server/docker/lingxiloop-server.Dockerfile'
              - 'server/docker/lingxiloop-server.Dockerfile.dockerignore'
            open_notebook:
              - 'third_party/open-notebook/Dockerfile'
              - 'third_party/open-notebook/.dockerignore'
              - 'third_party/open-notebook/pyproject.toml'
              - 'third_party/open-notebook/uv.lock'
              - 'third_party/open-notebook/rag_commands.py'
              - 'third_party/open-notebook/supervisord.rag.conf'
              - 'third_party/open-notebook/api/__init__.py'
              - 'third_party/open-notebook/api/middleware.py'
              - 'third_party/open-notebook/api/rag_*.py'
              - 'third_party/open-notebook/open_notebook/__init__.py'
              - 'third_party/open-notebook/open_notebook/config.py'
              - 'third_party/open-notebook/open_notebook/exceptions.py'
              - 'third_party/open-notebook/open_notebook/artifact_storage.py'
              - 'third_party/open-notebook/open_notebook/database/**'
              - 'third_party/open-notebook/open_notebook/domain/__init__.py'
              - 'third_party/open-notebook/open_notebook/domain/base.py'
              - 'third_party/open-notebook/open_notebook/rag/**'
              - 'third_party/open-notebook/open_notebook/utils/__init__.py'
              - 'third_party/open-notebook/open_notebook/utils/proxy.py'
              - 'third_party/open-notebook/open_notebook/utils/url_validation.py'
            open_notebook_tests:
              - 'third_party/open-notebook/tests/**'
              - 'third_party/open-notebook/Makefile'
            wukongim:
              - 'server/wukongim/**'
              - 'server/docker/wukongim.Dockerfile'
            gateway:
              - 'deploy/komodo/lingxiloop-app-b/gateway.conf'
              - 'deploy/komodo/lingxiloop-app-b/gateway.Dockerfile'
            ci:
              - '.github/workflows/ci.yml'
              - 'scripts/ci-scope.mjs'
              - 'scripts/production-rag-contract.test.mjs'
              - 'scripts/update-deployment-images.mjs'
              - 'scripts/trigger-komodo-rollout.mjs'
              - 'scripts/test-distributed-realtime.mjs'
              - 'scripts/test-native-agent-*.mjs'
            deployment:
              - 'deploy/**'
              - '!deploy/**/*.md'
            control_migrations:
              - 'workers/control-plane/migrations/**'
            release:
              - 'VERSION'
      - id: scope
        shell: bash
        env:
          INTEGRATION_FILES: ${{ steps.paths.outputs.integration_tests_files }}
          EVENT: ${{ github.event_name }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          SHARED_FRONTEND: ${{ steps.paths.outputs.shared_frontend }}
          TEST_RUNNER: ${{ steps.paths.outputs.test_runner }}
          LINT_CONFIG: ${{ steps.paths.outputs.lint_config }}
          WEB_TESTS: ${{ steps.paths.outputs.web_tests }}
          ADMIN_TESTS: ${{ steps.paths.outputs.admin_tests }}
          CONTROL_TESTS: ${{ steps.paths.outputs.control_tests }}
          SERVER_TESTS: ${{ steps.paths.outputs.server_tests }}
          INTEGRATION_RUNNER: ${{ steps.paths.outputs.integration_runner }}
          INTEGRATION_TESTS: ${{ steps.paths.outputs.integration_tests }}
          OPEN_NOTEBOOK_TESTS: ${{ steps.paths.outputs.open_notebook_tests }}
          CI_CONFIG: ${{ steps.paths.outputs.ci }}
          WEB: ${{ steps.paths.outputs.web }}
          ADMIN: ${{ steps.paths.outputs.admin }}
          CONTROL: ${{ steps.paths.outputs.control }}
          SERVER: ${{ steps.paths.outputs.server }}
          SERVER_SOURCE: ${{ steps.paths.outputs.server_source }}
          SERVER_DOCKER: ${{ steps.paths.outputs.server_docker }}
          OPEN_NOTEBOOK: ${{ steps.paths.outputs.open_notebook }}
          WUKONGIM: ${{ steps.paths.outputs.wukongim }}
          GATEWAY: ${{ steps.paths.outputs.gateway }}
          DEPLOYMENT: ${{ steps.paths.outputs.deployment }}
          CONTROL_MIGRATIONS: ${{ steps.paths.outputs.control_migrations }}
          RELEASE: ${{ steps.paths.outputs.release }}
        run: node scripts/ci-scope.mjs

  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: ${{ needs.changes.outputs.server == 'true' && 'redis:7-alpine' || '' }}
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - if: needs.changes.outputs.web == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.control == 'true' || needs.changes.outputs.server == 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - if: needs.changes.outputs.web == 'true'
        run: npm run lint && npm test
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.web_tests }}
      - if: needs.changes.outputs.web_build == 'true' && !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.changes.outputs.release == 'true'))
        run: npm run build
      - if: needs.changes.outputs.web == 'true' && needs.changes.outputs.web_build != 'true'
        run: npm run typecheck
      - if: needs.changes.outputs.admin == 'true'
        run: npm run admin:lint && npm run admin:test
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.admin_tests }}
      - if: needs.changes.outputs.admin_build == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run admin:build
      - if: needs.changes.outputs.admin == 'true' && needs.changes.outputs.admin_build != 'true'
        run: npm run admin:typecheck
      - if: needs.changes.outputs.server == 'true'
        run: npm run server:lint && npm run server:typecheck && npm run server:test && node --test scripts/test-selectors.test.mjs
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.server_tests }}
      - if: needs.changes.outputs.control == 'true'
        run: npm run control:lint && npm run control:typecheck && npm run control:test
      - if: needs.changes.outputs.open_notebook == 'true'
        uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: third_party/open-notebook/uv.lock }
      - if: needs.changes.outputs.open_notebook == 'true'
        working-directory: third_party/open-notebook
        run: uv run --frozen --python 3.12 pytest -q
      - if: needs.changes.outputs.deploy_contract == 'true'
        run: node --test scripts/production-rag-contract.test.mjs
      - if: needs.changes.outputs.release == 'true'
        run: npm run version:check

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lingxiloop_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d lingxiloop_test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      REDIS_URL: redis://127.0.0.1:6379
      LINGXIOS_TEST_REDIS_URL: redis://127.0.0.1:6379
      OPENAI_API_KEY: integration-test-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      LINGXILOOP_INVITE_BASE_URL: http://127.0.0.1:5180
      LINGXILOOP_GATEWAY_HMAC_SECRET: integration-gateway-secret
      WUKONG_USER_TOKEN_SECRET: integration-wukong-user-token-secret
      AGENT_OS_INPUT_COST_MICROS_PER_MILLION: "1"
      AGENT_OS_OUTPUT_COST_MICROS_PER_MILLION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run db:migrate
      - if: needs.changes.outputs.server != 'true'
        run: node --test scripts/test-selectors.test.mjs
      - run: npm run test:integration
        env:
          INTEGRATION_TEST_FILES: ${{ needs.changes.outputs.integration_files }}
      - if: needs.changes.outputs.deep_integration == 'true'
        name: Distributed SSE with a real Redis restart
        run: node --import tsx scripts/test-distributed-realtime.mjs
        env:
          LINGXIOS_BENCH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - if: needs.changes.outputs.deep_integration == 'true'
        name: Native product Worker flows on empty databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          LINGXIOS_NATIVE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          for capability in documents canvas learning eval; do
            createdb "native_${capability}"
            LINGXIOS_NATIVE_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/native_${capability}" \
              node "scripts/test-native-agent-${capability}.mjs"
          done

  publish:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.changes.outputs.release == 'true') &&
      needs.changes.outputs.publish == 'true' &&
      needs.checks.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    needs: [changes, checks, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          secrets: |
            npm_token=${{ matrix.package == 'lingxiloop-server' && (secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN) || '' }}
          tags: ghcr.io/${{ steps.metadata.outputs.owner }}/${{ matrix.package }}:${{ github.sha }}
          build-args: |
            LINGXILOOP_VERSION=${{ steps.metadata.outputs.version }}
            LINGXILOOP_COMMIT_SHA=${{ github.sha }}
            WUKONG_COMMIT=${{ matrix.wukong_commit }}
            VITE_TURNSTILE_SITE_KEY=0x4AAAAAAEsX5eyOl1nAe5i9
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

  update-manifests:
    if: >-
      always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.changes.outputs.release == 'true') &&
      needs.checks.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
      (needs.publish.result == 'success' ||
       (needs.changes.outputs.publish == 'false' && needs.changes.outputs.deployment == 'true'))
    needs: [changes, checks, integration, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    outputs:
      commit-sha: ${{ steps.pin.outputs.commit-sha }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 0 }
      - name: Pin images published by this change
        id: pin
        run: |
          git pull --rebase origin main
          if [ "${{ needs.changes.outputs.publish }}" = "true" ]; then
            node scripts/update-deployment-images.mjs "$GITHUB_SHA" ${{ needs.changes.outputs.packages }}
          fi
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add deploy/komodo/*/compose.yml
            git commit -m "deploy: pin images to ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          deployment_tree=$(printf '040000 tree %s\tdeploy\n' "$(git rev-parse HEAD:deploy)" | git mktree)
          deployment_parents=()
          if git ls-remote --exit-code origin refs/heads/codex/production >/dev/null; then
            git fetch origin refs/heads/codex/production
            deployment_parents=(-p "$(git rev-parse FETCH_HEAD)")
          fi
          deployment_commit=$(git commit-tree "$deployment_tree" "${deployment_parents[@]}" -m "Deploy $(git rev-parse HEAD)")
          git push origin "$deployment_commit:refs/heads/codex/production"
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.control_deploy == 'true' && needs.checks.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    needs: [changes, checks, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build Refine before production changes
        run: npm run admin:build
        env:
          VITE_LINGXILIT_URL: ${{ vars.VITE_LINGXILIT_URL || 'https://openlit.lingxilearn.cn' }}
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAEsX5eyOl1nAe5i9
      - if: needs.changes.outputs.control_migrations == 'true'
        name: Apply D1 migrations
        run: npm run control:d1:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Refine and control-plane Worker
        run: |
          npx wrangler versions upload --config workers/control-plane/wrangler.jsonc --tag "$GITHUB_SHA"
          npx wrangler versions deploy --config workers/control-plane/wrangler.jsonc --version-tag "$GITHUB_SHA" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_LINGXILIT_URL: ${{ vars.VITE_LINGXILIT_URL || 'https://openlit.lingxilearn.cn' }}
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAEsX5eyOl1nAe5i9

  rollout:
    if: >-
      always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || needs.changes.outputs.release == 'true') &&
      needs.update-manifests.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs: [changes, update-manifests, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
      KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Trigger Komodo rollout
        run: node scripts/trigger-komodo-rollout.mjs
