name: LingxiLoop CI and CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lingxiloop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run server:typecheck
      - run: npm run admin:typecheck
      - run: npm run control:typecheck
      - run: npm run build
      - run: npm run admin:build
      - name: Verify vendored Open Notebook scope
        working-directory: third_party/open-notebook
        run: python -m pip install pytest python-dotenv && python -m pytest -q tests/test_lingxiloop_native_scope.py
      - run: node --test scripts/production-rag-contract.test.mjs

  unit-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --disable-pip-version-check ipython==9.4.0
      - run: npm ci
      - run: npm test
      - run: npm run control:test
      - run: npm run eval:check
      - if: always() && hashFiles('artifacts/eval-*.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: agent-eval, path: "artifacts/eval-*.json", if-no-files-found: error }

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lingxiloop_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d lingxiloop_test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      REDIS_URL: redis://127.0.0.1:6379
      OPENAI_API_KEY: integration-test-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      LINGXILOOP_INVITE_BASE_URL: http://127.0.0.1:5180
      LINGXILOOP_GATEWAY_HMAC_SECRET: integration-gateway-secret
      WUKONG_USER_TOKEN_SECRET: integration-wukong-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:integration

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, unit-eval, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: lingxiloop-server, dockerfile: server/docker/lingxiloop-server.Dockerfile, context: ".", target: "", wukong_commit: "" }
          - { package: lingxiloop-agent-os, dockerfile: server/docker/agent-os.Dockerfile, context: ".", target: "", wukong_commit: "" }
          - { package: lingxiloop-wukongim, dockerfile: server/docker/wukongim.Dockerfile, context: ".", target: "", wukong_commit: c7f663fa23a4ee2c6f7e08c68423f50f0f6e9c47 }
          - { package: lingxiloop-open-notebook, dockerfile: third_party/open-notebook/Dockerfile, context: ./third_party/open-notebook, target: lingxiloop-rag, wukong_commit: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.metadata.outputs.owner }}/${{ matrix.package }}:${{ github.sha }}
            ghcr.io/${{ steps.metadata.outputs.owner }}/${{ matrix.package }}:mvp
          build-args: |
            LINGXILOOP_VERSION=${{ steps.metadata.outputs.version }}
            LINGXILOOP_COMMIT_SHA=${{ github.sha }}
            WUKONG_COMMIT=${{ matrix.wukong_commit }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
      - run: mkdir -p image-digests && printf '%s\n' '${{ steps.build.outputs.digest }}' > image-digests/${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with: { name: "image-digest-${{ matrix.package }}", path: "image-digests/${{ matrix.package }}", retention-days: 1 }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/download-artifact@v4
        with: { pattern: "image-digest-*", path: image-digests, merge-multiple: true }
      - run: npm ci
      - name: Apply D1 migrations
        run: npm run control:d1:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Refine and control-plane Worker
        run: npm run control:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_LINGXILIT_URL: ${{ vars.VITE_LINGXILIT_URL }}
      - name: Trigger idempotent OpenShip release
        if: vars.OPENSHIP_CD_ENABLED == 'true'
        shell: bash
        env:
          RELEASE_HMAC_SECRET: ${{ secrets.RELEASE_HMAC_SECRET }}
          CONTROL_PLANE_ORIGIN: ${{ vars.CONTROL_PLANE_ORIGIN }}
        run: |
          set -euo pipefail
          : "${RELEASE_HMAC_SECRET:?Set RELEASE_HMAC_SECRET}"
          : "${CONTROL_PLANE_ORIGIN:?Set CONTROL_PLANE_ORIGIN}"
          payload="$(node - <<'NODE'
          const { readFileSync } = require('node:fs')
          const names = {
            LINGXILOOP_SERVER_IMAGE: 'lingxiloop-server',
            AGENT_OS_IMAGE: 'lingxiloop-agent-os',
            WUKONGIM_IMAGE: 'lingxiloop-wukongim',
            OPEN_NOTEBOOK_IMAGE: 'lingxiloop-open-notebook',
          }
          const owner = process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()
          const imageDigests = Object.fromEntries(Object.entries(names).map(([key, name]) => [key, `ghcr.io/${owner}/${name}@${readFileSync(`image-digests/${name}`, 'utf8').trim()}`]))
          process.stdout.write(JSON.stringify({ commitSha: process.env.GITHUB_SHA, imageDigests }))
          NODE
          )"
          signature="$(PAYLOAD="$payload" SECRET="$RELEASE_HMAC_SECRET" node -e "process.stdout.write(require('node:crypto').createHmac('sha256',process.env.SECRET).update(process.env.PAYLOAD).digest('base64url'))")"
          curl --fail-with-body --retry 3 -X POST "${CONTROL_PLANE_ORIGIN%/}/api/internal/releases" -H 'content-type: application/json' -H "x-release-signature: $signature" --data-binary "$payload"
