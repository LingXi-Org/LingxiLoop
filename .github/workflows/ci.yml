name: Komodo read-only rollout diagnosis 149
on:
  workflow_dispatch:
    inputs:
      scope:
        type: string
        default: deployment
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/diagnose-149.mjs
