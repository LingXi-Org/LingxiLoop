name: LingxiLoop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Component to verify, or run deep integration checks
        required: true
        type: choice
        options: [web, admin-control, server, open-notebook, wukongim, gateway, deployment, release, deep-integration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin_build: ${{ steps.scope.outputs.admin_build }}
      integration_files: ${{ steps.scope.outputs.integration_files }}
      integration_mode: ${{ steps.scope.outputs.integration_mode }}
      deep_integration: ${{ steps.scope.outputs.deep_integration }}
      open_notebook: ${{ steps.scope.outputs.open_notebook }}
      deployment: ${{ steps.scope.outputs.deployment }}
      web_build: ${{ steps.scope.outputs.web_build }}
      web_tests: ${{ steps.paths.outputs.web_tests_files }}
      admin_tests: ${{ steps.paths.outputs.admin_tests_files }}
      server_tests: ${{ steps.paths.outputs.server_tests_files }}
      web: ${{ steps.scope.outputs.web }}
      admin: ${{ steps.scope.outputs.admin }}
      control: ${{ steps.scope.outputs.control }}
      server: ${{ steps.scope.outputs.server }}
      integration: ${{ steps.scope.outputs.integration }}
      deploy_contract: ${{ steps.scope.outputs.deploy_contract }}
      control_deploy: ${{ steps.scope.outputs.control_deploy }}
      control_migrations: ${{ steps.scope.outputs.control_migrations }}
      release: ${{ steps.scope.outputs.release }}
      checks: ${{ steps.scope.outputs.checks }}
      check_jobs: ${{ steps.scope.outputs.check_jobs }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: dorny/paths-filter@v4
        id: paths
        with:
          list-files: json
          predicate-quantifier: some-with-excludes
          filters: |
            shared_frontend:
              - '.npmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'server/build/**'
              - 'server/scripts/scoped-dependencies*'
              - 'server/scripts/install-scoped-dependencies.mjs'
            lint_config:
              - 'biome.json'
            test_runner:
              - 'scripts/run-tests.mjs'
              - 'scripts/test-selectors.test.mjs'
            web:
              - 'workers/web-static/**'
              - 'shared/artifact-editor-origin.ts'
              - 'shared/slides-editor-context.ts'
              - 'shared/visualize-public-resources.ts'
              - 'third_party/zcode/**'
              - 'third_party/assistant-ui/streaming-text/**'
              - 'third_party/assistant-ui-elements/**'
              - 'third_party/react-chat-elements/reply-message/**'
              - 'scripts/verify-zcode-visualize.mjs'
              - 'scripts/build-visualize-runtime.mjs'
              - 'scripts/build-slides-editor.mjs'
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'postcss.config.js'
              - 'tailwind.config.ts'
              - '!src/**/*.test.*'
              - '!src/**/__tests__/**'
            web_tests:
              - 'src/**/*.test.*'
            admin:
              - 'admin/**'
              - 'vite.admin.config.ts'
              - 'tsconfig.admin.json'
              - 'src/components/GlobalInteractionProvider.tsx'
              - 'src/components/ResourceSkeleton.tsx'
              - 'src/components/ui/**'
              - 'src/lib/actionToast.ts'
              - 'src/lib/confirmAction.ts'
              - '!**/*.test.*'
            admin_tests:
              - 'admin/**/*.test.*'
            control:
              - 'src/auth/contracts.ts'
              - 'workers/control-plane/**'
              - 'worker-configuration.d.ts'
              - '!workers/control-plane/**/*.test.*'
              - '!workers/control-plane/vitest.config.ts'
              - '!workers/control-plane/wrangler.test.jsonc'
            control_tests:
              - 'workers/control-plane/**/*.test.*'
              - 'workers/control-plane/vitest.config.ts'
              - 'workers/control-plane/wrangler.test.jsonc'
            server:
              - 'server/tsconfig.json'
            server_tests:
              - 'server/src/**/*.test.ts'
              - '!server/src/__integration__/**'
            # Include shared sources loaded by the server runtime and copied by its image.
            server_source:
              - 'shared/artifact-editor-origin.ts'
              - 'shared/slides-editor-context.ts'
              - 'shared/visualize-public-resources.ts'
              - 'third_party/zcode/**'
              - 'third_party/baoyu-design/**'
              - 'scripts/verify-zcode-visualize.mjs'
              - 'scripts/build-visualize-runtime.mjs'
              - 'scripts/build-slides-editor.mjs'
              - 'server/.npmrc'
              - 'server/scripts/**'
              - 'server/src/**'
              - '!server/src/**/*.test.ts'
              - '!server/src/__tests__/**'
              - '!server/src/__integration__/**'
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'server/*.conf'
              - 'src/types.ts'
              - 'src/lib/conversationRunSummary.ts'
              - 'src/lib/agentToolCards.ts'
              - 'src/lib/researchSources.ts'
              - 'src/lib/agentCapabilities.ts'
              - 'src/lib/mentions.ts'
              - 'src/lib/participantDisplayName.ts'
              - 'src/lib/agentRunSnapshot.ts'
              - 'src/lib/nativeMessage.ts'
              - 'src/lib/artifactSources.ts'
              - 'src/lib/answerSegment.ts'
              - 'src/lib/userFacingError.ts'
              - 'src/lib/runActivity.ts'
              - 'src/lib/runTrace.ts'
              - 'src/lib/knowledgeSearch.ts'
              - 'src/lib/traceCost.ts'
              - 'src/lib/memoryActivity.ts'
              - 'src/features/cases/cover-vm/runtime.ts'
              - 'src/features/cases/cover-vm/protocol.ts'
              - 'src/features/cases/cover-vm/program.ts'
              - 'src/features/cases/cover-vm/guest-source.ts'
              - 'src/features/cases/cover-vm/svg.ts'
              - 'src/features/chat/visualize/zcode/shared/gen-ui/**'
              - 'src/features/chat/visualize/zcode/gen-ui/domain/**'
              - 'src/features/chat/visualize/zcode/lib/assistantDirectiveParser.ts'
            integration_tests:
              - 'server/src/__integration__/*.test.ts'
            integration_runner:
              - 'scripts/slides-editor.test.mjs'
              - 'server/run-integration-tests.mjs'
              - 'server/integration-suite.mjs'
              - 'server/run-historical-migration-tests.mjs'
              - 'server/fixtures/**'
              - 'scripts/ci-scope*.mjs'
              - '.github/workflows/ci.yml'
              - 'server/src/__integration__/**'
              - '!server/src/__integration__/*.test.ts'
            server_docker:
              - 'server/docker/lingxiloop-server.Dockerfile'
              - 'server/docker/lingxiloop-server.Dockerfile.dockerignore'
            open_notebook:
              - 'third_party/open-notebook/Dockerfile'
              - 'third_party/open-notebook/.dockerignore'
              - 'third_party/open-notebook/pyproject.toml'
              - 'third_party/open-notebook/uv.lock'
              - 'third_party/open-notebook/rag_commands.py'
              - 'third_party/open-notebook/supervisord.rag.conf'
              - 'third_party/open-notebook/api/__init__.py'
              - 'third_party/open-notebook/api/middleware.py'
              - 'third_party/open-notebook/api/rag_*.py'
              - 'third_party/open-notebook/open_notebook/__init__.py'
              - 'third_party/open-notebook/open_notebook/config.py'
              - 'third_party/open-notebook/open_notebook/exceptions.py'
              - 'third_party/open-notebook/open_notebook/artifact_storage.py'
              - 'third_party/open-notebook/open_notebook/database/**'
              - 'third_party/open-notebook/open_notebook/domain/__init__.py'
              - 'third_party/open-notebook/open_notebook/domain/base.py'
              - 'third_party/open-notebook/open_notebook/rag/**'
              - 'third_party/open-notebook/open_notebook/utils/__init__.py'
              - 'third_party/open-notebook/open_notebook/utils/proxy.py'
              - 'third_party/open-notebook/open_notebook/utils/url_validation.py'
            open_notebook_tests:
              - 'third_party/open-notebook/tests/**'
              - 'third_party/open-notebook/Makefile'
            wukongim:
              - 'server/wukongim/**'
              - 'server/docker/wukongim.Dockerfile'
            gateway:
              - 'deploy/app-b/gateway.conf'
              - 'deploy/app-b/gateway.Dockerfile'
            ci:
              - '.gitattributes'
              - 'scripts/checkout-bytes.test.mjs'
              - '.github/workflows/*.yml'
              - 'scripts/ci-scope*.mjs'
              - 'scripts/image-tag.mjs'
              - 'scripts/production-*-contract.test.mjs'
              - 'scripts/knowledge-shadow-pg-*.mjs'
              - 'scripts/test-distributed-realtime.mjs'
              - 'scripts/test-native-agent-*.mjs'
            deployment:
              - 'deploy/**'
              - '!deploy/**/*.md'
            control_migrations:
              - 'workers/control-plane/migrations/**'
            release:
              - 'VERSION'
      - id: scope
        shell: bash
        env:
          INTEGRATION_FILES: ${{ steps.paths.outputs.integration_tests_files }}
          SERVER_SOURCE_FILES: ${{ steps.paths.outputs.server_source_files }}
          INTEGRATION_RUNNER_FILES: ${{ steps.paths.outputs.integration_runner_files }}
          EVENT: ${{ github.event_name }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          SHARED_FRONTEND: ${{ steps.paths.outputs.shared_frontend }}
          TEST_RUNNER: ${{ steps.paths.outputs.test_runner }}
          LINT_CONFIG: ${{ steps.paths.outputs.lint_config }}
          WEB_TESTS: ${{ steps.paths.outputs.web_tests }}
          ADMIN_TESTS: ${{ steps.paths.outputs.admin_tests }}
          CONTROL_TESTS: ${{ steps.paths.outputs.control_tests }}
          SERVER_TESTS: ${{ steps.paths.outputs.server_tests }}
          INTEGRATION_RUNNER: ${{ steps.paths.outputs.integration_runner }}
          INTEGRATION_TESTS: ${{ steps.paths.outputs.integration_tests }}
          OPEN_NOTEBOOK_TESTS: ${{ steps.paths.outputs.open_notebook_tests }}
          CI_CONFIG: ${{ steps.paths.outputs.ci }}
          WEB: ${{ steps.paths.outputs.web }}
          WEB_FILES: ${{ steps.paths.outputs.web_files }}
          ADMIN: ${{ steps.paths.outputs.admin }}
          CONTROL: ${{ steps.paths.outputs.control }}
          SERVER: ${{ steps.paths.outputs.server }}
          SERVER_SOURCE: ${{ steps.paths.outputs.server_source }}
          SERVER_DOCKER: ${{ steps.paths.outputs.server_docker }}
          OPEN_NOTEBOOK: ${{ steps.paths.outputs.open_notebook }}
          WUKONGIM: ${{ steps.paths.outputs.wukongim }}
          GATEWAY: ${{ steps.paths.outputs.gateway }}
          DEPLOYMENT: ${{ steps.paths.outputs.deployment }}
          CONTROL_MIGRATIONS: ${{ steps.paths.outputs.control_migrations }}
          RELEASE: ${{ steps.paths.outputs.release }}
        run: node scripts/ci-scope.mjs

  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.check_jobs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: ${{ matrix.component == 'server' && 'redis:7-alpine' || '' }}
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          # Backup plans qualify immutable historical source manifests/locks.
          fetch-depth: ${{ matrix.component == 'deploy-contract' && '0' || '1' }}
      - uses: actions/setup-node@v5
        if: matrix.component != 'open-notebook'
        with:
          node-version: "22"
          cache: ${{ matrix.component != 'release' && 'npm' || '' }}
          cache-dependency-path: ${{ format('server/build/{0}/package-lock.json', matrix.component == 'web' && 'web-ci' || matrix.component == 'server' && 'server-ci' || matrix.component == 'release' && 'deploy-contract' || matrix.component) }}
      # Version synchronization reads JSON with Node builtins; it needs no packages.
      - if: matrix.component != 'open-notebook' && matrix.component != 'release'
        run: |
          node server/scripts/scoped-dependencies.mjs
          node --test server/scripts/scoped-dependencies.test.mjs
          node server/scripts/install-scoped-dependencies.mjs ${{ matrix.component == 'web' && 'web-ci' || matrix.component == 'server' && 'server-ci' || matrix.component }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - if: matrix.component != 'open-notebook' && matrix.component != 'release'
        name: Record installed dependency footprint
        run: |
          du -sb node_modules
          du -sb "$(npm config get cache)"
      - if: matrix.component == 'web'
        run: node --test --test-name-pattern='SPA image' scripts/production-rag-contract.test.mjs
      - if: matrix.component == 'web'
        run: npm run lint && npm test
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.web_tests }}
      - if: matrix.component == 'web' && needs.changes.outputs.web_build == 'true'
        run: npm run build
      - if: matrix.component == 'web' && needs.changes.outputs.web == 'true' && needs.changes.outputs.web_build != 'true'
        run: npm run typecheck
      - if: matrix.component == 'admin'
        run: npm run admin:lint && npm run admin:test
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.admin_tests }}
      - if: matrix.component == 'admin' && needs.changes.outputs.admin_build == 'true'
        run: npm run admin:build
      - if: matrix.component == 'admin' && needs.changes.outputs.admin == 'true' && needs.changes.outputs.admin_build != 'true'
        run: npm run admin:typecheck
      - if: matrix.component == 'server'
        run: npm run server:lint && npm run server:typecheck && npm run server:test && node --test scripts/test-selectors.test.mjs
        env:
          CI_TEST_FILES: ${{ needs.changes.outputs.server_tests }}
      - if: matrix.component == 'server'
        name: Verify OfficeParser runtime pruning against product fixtures
        run: node server/scripts/test-officeparser-runtime-prune.mjs node_modules server/src/modules/learning/homework-presentation.ts
      - if: matrix.component == 'control'
        run: npm run control:lint && npm run control:typecheck && npm run control:test
      - if: matrix.component == 'open-notebook'
        uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: third_party/open-notebook/uv.lock }
      - if: matrix.component == 'open-notebook'
        name: Start isolated shadow-generation database
        run: |
          docker run -d --name rag-shadow-ci -p 127.0.0.1:18879:8000 \
            docker.io/surrealdb/surrealdb@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011 \
            start --user test --pass test memory
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18879/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - if: matrix.component == 'open-notebook'
        working-directory: third_party/open-notebook
        env:
          RAG_SHADOW_TEST_URL: ws://127.0.0.1:18879/rpc
        run: uv run --frozen --python 3.12 pytest -q --junitxml=shadow-generation-junit.xml
      - if: always() && matrix.component == 'open-notebook'
        uses: actions/upload-artifact@v4
        with:
          name: shadow-generation-junit
          path: third_party/open-notebook/shadow-generation-junit.xml
      - if: always() && matrix.component == 'open-notebook'
        run: docker rm -f rag-shadow-ci
      - if: matrix.component == 'deploy-contract'
        run: |
          node --test scripts/ci-scope.test.mjs scripts/checkout-bytes.test.mjs scripts/production-rag-contract.test.mjs scripts/production-model-contract.test.mjs workers/web-static/src/index.test.mjs
          node --experimental-test-module-mocks --test scripts/knowledge-shadow-pg-*.test.mjs
          node --check deploy/cli.mjs
          node --test deploy/runtime-patch.test.mjs
          node scripts/image-tag.mjs env
      - if: matrix.component == 'release'
        run: npm run version:check

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.changes.outputs.deep_integration == 'true' && 30 || 8 }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lingxiloop_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d lingxiloop_test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      REDIS_URL: redis://127.0.0.1:6379
      LINGXIOS_TEST_REDIS_URL: redis://127.0.0.1:6379
      OPENAI_API_KEY: integration-test-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      LINGXILOOP_INVITE_BASE_URL: http://127.0.0.1:5180
      LINGXILOOP_GATEWAY_HMAC_SECRET: integration-gateway-secret
      WUKONG_USER_TOKEN_SECRET: integration-wukong-user-token-secret
      AGENT_OS_INPUT_COST_MICROS_PER_MILLION: "1"
      AGENT_OS_OUTPUT_COST_MICROS_PER_MILLION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/build/integration/package-lock.json
      - run: node server/scripts/scoped-dependencies.mjs && node server/scripts/install-scoped-dependencies.mjs integration
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run verify:visualize && npm run build:visualize-runtime && node --test scripts/slides-editor.test.mjs
      - run: node --test server/scripts/bootstrap-runtime-patch-test-db.test.mjs && node server/scripts/bootstrap-runtime-patch-test-db.mjs
        env:
          NODE_ENV: test
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - if: needs.changes.outputs.server != 'true'
        run: node --test scripts/test-selectors.test.mjs
      - run: npm run test:integration
        env:
          INTEGRATION_TEST_MODE: ${{ needs.changes.outputs.integration_mode }}
          INTEGRATION_TEST_FILES: ${{ needs.changes.outputs.integration_files }}
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-timings-${{ github.sha }}
          path: artifacts/ci-integration/timings.json
          if-no-files-found: warn
          retention-days: 7
      - if: needs.changes.outputs.deep_integration == 'true'
        name: Distributed SSE with a real Redis restart
        run: node --import tsx scripts/test-distributed-realtime.mjs
        env:
          LINGXIOS_BENCH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - if: needs.changes.outputs.deep_integration == 'true'
        name: Native product Worker flows on empty databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          LINGXIOS_NATIVE_TEST_REDIS_URL: redis://127.0.0.1:6379
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for capability in documents artifacts; do
            createdb "native_${capability}_test"
            NODE_ENV=test \
              DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/native_${capability}_test" \
              INTEGRATION_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/native_${capability}_test" \
              node server/scripts/bootstrap-runtime-patch-test-db.mjs
            LINGXIOS_NATIVE_TEST_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/native_${capability}_test" \
              node "scripts/test-native-agent-${capability}.mjs"
          done


  # Production: images build and hosts pre-pull while checks run; only the
  # rollout waits for them. Every deploy step is deploy/cli.mjs under Sigillo.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip deploy]')
    permissions: { contents: read, packages: write }
    uses: ./.github/workflows/images.yml
    secrets: inherit

  prefetch:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { SIGILLO_TOKEN: "${{ secrets.SIGILLO_TOKEN }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: node deploy/cli.mjs pull

  deploy:
    needs: [changes, checks, integration, prefetch]
    if: >-
      always() && needs.prefetch.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: production-deploy, cancel-in-progress: false }
    env: { SIGILLO_TOKEN: "${{ secrets.SIGILLO_TOKEN }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/build/admin-control/package-lock.json
      - run: node deploy/cli.mjs up
