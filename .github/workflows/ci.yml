name: LingxiLoop CI and CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lingxiloop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm run server:typecheck
      - run: npm run control:typecheck
      - run: npm run build
      - run: npm run admin:build
      - run: node --test scripts/production-rag-contract.test.mjs

  unit-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --disable-pip-version-check ipython==9.4.0
      - run: npm ci
      - run: npm test
      - run: npm run control:test
      - run: npm run eval:check
      - if: always() && hashFiles('artifacts/eval-*.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: agent-eval, path: "artifacts/eval-*.json", if-no-files-found: error }

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lingxiloop_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d lingxiloop_test" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lingxiloop_test
      REDIS_URL: redis://127.0.0.1:6379
      OPENAI_API_KEY: integration-test-key
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      LINGXILOOP_INVITE_BASE_URL: http://127.0.0.1:5180
      LINGXILOOP_GATEWAY_HMAC_SECRET: integration-gateway-secret
      WUKONG_USER_TOKEN_SECRET: integration-wukong-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:integration

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, unit-eval, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: lingxiloop-server, dockerfile: server/docker/lingxiloop-server.Dockerfile, context: ".", target: "", wukong_commit: "" }
          - { package: lingxiloop-agent-os, dockerfile: server/docker/agent-os.Dockerfile, context: ".", target: "", wukong_commit: "" }
          - { package: lingxiloop-wukongim, dockerfile: server/docker/wukongim.Dockerfile, context: ".", target: "", wukong_commit: c7f663fa23a4ee2c6f7e08c68423f50f0f6e9c47 }
          - { package: lingxiloop-open-notebook, dockerfile: third_party/open-notebook/Dockerfile, context: ./third_party/open-notebook, target: lingxiloop-rag, wukong_commit: "" }
          - { package: lingxiloop-gateway, dockerfile: deploy/openship/gateway.Dockerfile, context: ".", target: "", wukong_commit: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.metadata.outputs.owner }}/${{ matrix.package }}:${{ github.sha }}
          build-args: |
            LINGXILOOP_VERSION=${{ steps.metadata.outputs.version }}
            LINGXILOOP_COMMIT_SHA=${{ github.sha }}
            WUKONG_COMMIT=${{ matrix.wukong_commit }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

  update-manifests:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    outputs:
      commit-sha: ${{ steps.pin.outputs.commit-sha }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main, fetch-depth: 0 }
      - name: Pin Compose images to the published commit
        id: pin
        run: |
          git pull --rebase origin main
          node scripts/update-deployment-images.mjs "$GITHUB_SHA"
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add deploy/openship/*.yml docker-compose.production.yml docker-compose.mvp.yml docker-compose.dokploy.yml
            git commit -m "deploy: pin images to ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi
          echo "commit-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: update-manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Apply D1 migrations
        run: npm run control:d1:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Refine and control-plane Worker
        run: |
          npm run admin:build
          npx wrangler versions upload --config workers/control-plane/wrangler.jsonc --tag "$GITHUB_SHA"
          npx wrangler versions deploy --config workers/control-plane/wrangler.jsonc --version-tag "$GITHUB_SHA" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_LINGXILIT_URL: ${{ vars.VITE_LINGXILIT_URL }}
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAEk9EZhHYeS3szPO
      - name: Trigger OpenShip production rollout
        run: node scripts/trigger-openship-release.mjs
        env:
          RELEASE_HMAC_SECRET: ${{ secrets.RELEASE_HMAC_SECRET }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_DEPLOY_COMMIT_SHA: ${{ needs.update-manifests.outputs.commit-sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
