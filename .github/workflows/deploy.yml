name: Deploy production

# Runs deploy/cli.mjs, the same entry a local `npm run deploy` uses:
#   gh workflow run deploy.yml                                   # up: everything
#   gh workflow run deploy.yml -f command=servers -f stacks="app-a app-b"
on:
  workflow_dispatch:
    inputs:
      command:
        description: Deployment or read-only diagnostic command
        type: choice
        options: [up, servers, workers, pull, plan, status, runtime-preflight, runtime-observe, capacity-observe, knowledge-observe]
        default: up
      stacks:
        description: Space-separated server stacks (empty = all)
        type: string
        default: ''
      activate_native:
        description: For up only; enable native editing after both server slots have converged
        type: boolean
        default: false
      run_id:
        description: Exact run ID for knowledge-observe only (no deployment)
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: inputs.command == 'up' || inputs.command == 'servers' || inputs.command == 'pull' || inputs.command == 'plan'
    uses: ./.github/workflows/images.yml
    secrets: inherit

  deploy:
    needs: images
    if: always() && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: { group: production-deploy, cancel-in-progress: false }
    env:
      SIGILLO_TOKEN: ${{ secrets.SIGILLO_TOKEN }}
      SIGILLO_API_URL: https://sigillo.lingxilearn.cn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/build/admin-control/package-lock.json
      - name: Keep native writes closed during protocol cutover
        if: inputs.command == 'up' && inputs.activate_native
        run: npm exec --yes --package=sigillo@0.14.2 -- sigillo secrets set NATIVE_ARTIFACT_WRITES_ENABLED false -p 01M1TZH9C21C1A9PFAR8E41553 -c prod
      - if: inputs.command != 'knowledge-observe' && inputs.command != 'capacity-observe'
        run: node deploy/cli.mjs ${{ inputs.command }} ${{ inputs.stacks }}
      - name: Read-only knowledge observation
        if: inputs.command == 'knowledge-observe'
        env:
          OBSERVATION_RUN_ID: ${{ inputs.run_id }}
        run: node deploy/cli.mjs knowledge-observe "$OBSERVATION_RUN_ID"
      - name: Activate native editing after successful server and client convergence
        if: inputs.command == 'up' && inputs.activate_native
        run: |
          npm exec --yes --package=sigillo@0.14.2 -- sigillo secrets set NATIVE_ARTIFACT_WRITES_ENABLED true -p 01M1TZH9C21C1A9PFAR8E41553 -c prod
          node deploy/cli.mjs servers app-a app-b
      - name: Read-only Worker capacity observation
        if: inputs.command == 'capacity-observe'
        run: node deploy/cli.mjs capacity-observe
