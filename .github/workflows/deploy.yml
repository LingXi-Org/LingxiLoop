name: Deploy production

# Called by CI after main passes its checks; also runnable by hand to redeploy
# the current main or a subset of stacks:
#   gh workflow run deploy.yml                       # everything
#   gh workflow run deploy.yml -f stacks="app-a app-b" -f workers=false
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      stacks:
        description: Space-separated server stacks (empty = all, "none" = skip servers)
        type: string
        default: ''
      workers:
        description: Deploy the Cloudflare Workers (web + admin/control plane)
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.tags.outputs.images }}
    steps:
      - uses: actions/checkout@v5
      - id: tags
        run: echo "images=$(node scripts/image-tag.mjs json)" >> "$GITHUB_OUTPUT"

  # Content-addressed tags: an image whose inputs are unchanged is already in GHCR.
  images:
    needs: plan
    if: inputs.stacks != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: existing
        run: |
          if docker buildx imagetools inspect "${{ matrix.image.ref }}" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.existing.outputs.found != 'true'
        uses: actions/checkout@v5
      - if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ matrix.image.ref }}
          build-args: |
            ${{ matrix.image.build_args }}
            LINGXILOOP_COMMIT_SHA=${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.image.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.package }}

  servers:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install deploy SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts
      - run: deploy/deploy.sh ${{ inputs.stacks }}

  workers:
    if: github.event_name != 'workflow_dispatch' || inputs.workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAEsX5eyOl1nAe5i9
      VITE_LINGXILIT_URL: https://openlit.lingxilearn.cn
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/build/admin-control/package-lock.json
      - run: node server/scripts/scoped-dependencies.mjs && node server/scripts/install-scoped-dependencies.mjs admin-control
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LINGXIOS_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run build && npm run admin:build
      - run: npm run control:d1:remote
      - run: npx --no-install wrangler deploy --config workers/control-plane/wrangler.jsonc --tag "$GITHUB_SHA"
      - run: npx --no-install wrangler deploy --config workers/web-static/wrangler.jsonc --tag "$GITHUB_SHA"
