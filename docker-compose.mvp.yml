# MVP single-server deployment. Every LingxiLoop component is pulled from
# GitHub Container Registry; this file never builds application images.

x-quiet-logging: &quiet-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    pull_policy: always
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_min_error_statement=error"]
    environment:
      POSTGRES_USER: lingxiloop
      POSTGRES_PASSWORD: lingxiloop
      POSTGRES_DB: lingxiloop
    volumes:
      - lingxiloop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxiloop -d lingxiloop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    pull_policy: always
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - lingxiloop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  surrealdb:
    image: surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011
    pull_policy: always
    restart: unless-stopped
    command: ["start", "--log", "warn", "rocksdb:/data/open-notebook.db"]
    environment:
      SURREAL_USER: ${OPEN_NOTEBOOK_SURREAL_USER:-open-notebook}
      SURREAL_PASS: ${OPEN_NOTEBOOK_SURREAL_PASSWORD:-open-notebook-dev}
    volumes:
      - open-notebook-surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [lingxiloop-knowledge-internal]
    logging: *quiet-logging

  open-notebook:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-open-notebook:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:-lingxiloop-local-open-notebook-password}
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-5}
      OPEN_NOTEBOOK_R2_ENABLED: "true"
      OPEN_NOTEBOOK_R2_PREFIX: ${OPEN_NOTEBOOK_R2_PREFIX:-open-notebook}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      OPENAI_API_KEY: ${OPEN_NOTEBOOK_PASSWORD:-lingxiloop-local-open-notebook-password}
      OPENAI_BASE_URL: http://lingxiloop:5181/internal/open-notebook/v1
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required in .env}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${OPEN_NOTEBOOK_SURREAL_USER:-open-notebook}
      SURREAL_PASSWORD: ${OPEN_NOTEBOOK_SURREAL_PASSWORD:-open-notebook-dev}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
    volumes:
      - open-notebook-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "grep -a -l 'surreal-commands-worker' /proc/[0-9]*/cmdline 2>/dev/null | grep -q . && curl -fsS http://localhost:5055/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [lingxiloop-knowledge-internal, lingxiloop-knowledge-egress]
    logging: *quiet-logging

  wukongim:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-wukongim:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    environment:
      WK_NODE_DATA_DIR: /var/lib/wukongim
      WK_WEBHOOK_HTTP_ADDR: "http://lingxiloop:5181/webhooks/wukong?token=${WUKONG_WEBHOOK_SECRET:-dev-wukong-webhook-secret}"
    volumes:
      - lingxiloop-wukong-data:/var/lib/wukongim
    ports:
      - "${WUKONG_WS_BIND_ADDRESS:-0.0.0.0}:${WUKONG_WS_PORT:-5200}:5200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  db-migrate:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-server:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      REDIS_URL: redis://redis:6379
      WUKONG_USER_TOKEN_SECRET: ${WUKONG_USER_TOKEN_SECRET:?WUKONG_USER_TOKEN_SECRET is required in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required in .env}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required in .env}
      LINGXILOOP_INVITE_BASE_URL: ${LINGXILOOP_INVITE_BASE_URL:?LINGXILOOP_INVITE_BASE_URL is required}
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  lingxiloop:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-server:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      open-notebook:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment: &lingxiloop-environment
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: ${LINGXILOOP_LOG_LEVEL:-warn}
      PORT: 5181
      DATABASE_URL: postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      REDIS_URL: redis://redis:6379
      AGENT_OS_SERVICE_TOKEN: ${AGENT_OS_SERVICE_TOKEN:?AGENT_OS_SERVICE_TOKEN is required in .env}
      WUKONG_API_URL: http://wukongim:5001
      WUKONG_WS_URL: ${WUKONG_WS_URL:-ws://localhost:5200}
      WUKONG_API_TOKEN: ${WUKONG_API_TOKEN:-dev-wukong-api-token}
      WUKONG_WEBHOOK_SECRET: ${WUKONG_WEBHOOK_SECRET:-dev-wukong-webhook-secret}
      WUKONG_USER_TOKEN_SECRET: ${WUKONG_USER_TOKEN_SECRET:?WUKONG_USER_TOKEN_SECRET is required in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required in .env}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: lingxiloop-web
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      LINGXILIT_PRICING_JSON: ${LINGXILIT_PRICING_JSON:-}
      LINGXILOOP_PUBLIC_ORIGIN: ${LINGXILOOP_PUBLIC_ORIGIN:-http://localhost:5181}
      LINGXILOOP_GATEWAY_HMAC_SECRET: ${LINGXILOOP_GATEWAY_HMAC_SECRET:-dev-only-gateway-secret}
      LINGXILOOP_INVITE_BASE_URL: ${LINGXILOOP_INVITE_BASE_URL:?LINGXILOOP_INVITE_BASE_URL is required}
      LINGXILOOP_CORS_ORIGINS: ${LINGXILOOP_CORS_ORIGINS:-}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_PUBLIC_BASE: ${R2_PUBLIC_BASE:?R2_PUBLIC_BASE is required}
      R2_URL_SIGNING_SECRET: ${R2_URL_SIGNING_SECRET:?R2_URL_SIGNING_SECRET is required}
      R2_URL_TTL_SECONDS: ${R2_URL_TTL_SECONDS:-}
      SKILLHUB_URL: ${SKILLHUB_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-}
      OPEN_NOTEBOOK_ENABLED: ${OPEN_NOTEBOOK_ENABLED:-true}
      OPEN_NOTEBOOK_URL: http://open-notebook:5055
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:-lingxiloop-local-open-notebook-password}
      PRESENTATION_HTML_ENABLED: ${PRESENTATION_HTML_ENABLED:-false}
    ports:
      # Public by default so the mobile client can reach the API backend.
      - "${LINGXILOOP_BIND_ADDRESS:-0.0.0.0}:${LINGXILOOP_PORT:-5181}:5181"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp, lingxiloop-knowledge-internal]
    logging: *quiet-logging

  worker:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-server:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    command: ["npm", "run", "worker:start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      open-notebook:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *lingxiloop-environment
      OTEL_SERVICE_NAME: lingxiloop-worker
    networks: [lingxiloop-mvp, lingxiloop-knowledge-internal]
    logging: *quiet-logging

  agent-os:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-agent-os:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    depends_on:
      lingxiloop:
        condition: service_healthy
      wukongim:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: ${LINGXILOOP_LOG_LEVEL:-warn}
      AGENT_OS_PORT: 5190
      AGENT_OS_MAX_CONCURRENT_RUNS: ${AGENT_OS_MAX_CONCURRENT_RUNS:-8}
      AGENT_OS_SERVICE_TOKEN: ${AGENT_OS_SERVICE_TOKEN:?AGENT_OS_SERVICE_TOKEN is required in .env}
      LINGXILOOP_CONTROL_PLANE_URL: http://lingxiloop:5181
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required in .env}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: lingxiloop-agent-os
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      LINGXILIT_PRICING_JSON: ${LINGXILIT_PRICING_JSON:-}
      AGENT_OS_HOMES_ROOT: /var/lib/lingxiloop-agent-os/homes
    volumes:
      - lingxiloop-agent-os-data:/var/lib/lingxiloop-agent-os
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5190/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

networks:
  lingxiloop-mvp: {}
  lingxiloop-knowledge-internal:
    internal: true
  lingxiloop-knowledge-egress: {}

volumes:
  lingxiloop-postgres-data: {}
  lingxiloop-redis-data: {}
  lingxiloop-wukong-data: {}
  lingxiloop-agent-os-data: {}
  open-notebook-surreal-data: {}
  open-notebook-data: {}
