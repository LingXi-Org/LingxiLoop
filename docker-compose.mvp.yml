# MVP single-server Docker Compose deployment.
#
# Browser -> lingxiloop (SPA + API + WebSocket) -> Postgres / Redis
#                                             -> LingxiGraph Runtime
#
# Web/server mode only: one LingxiLoop replica, no Kubernetes/per-Agent Pod.

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingxiloop
      POSTGRES_PASSWORD: lingxiloop
      POSTGRES_DB: lingxiloop
    volumes:
      - lingxiloop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxiloop -d lingxiloop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp]

  lingxigraph-runtime:
    build:
      context: .
      dockerfile: server/docker/lingxigraph-runtime.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim-bookworm}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - LINGXIGRAPH_POSTGRES_URL=postgresql://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      - LINGXIGRAPH_REDIS_URL=redis://redis:6379/1
      - LINGXIGRAPH_INSECURE_DEV_AUTH=true
      - LINGXIGRAPH_MODEL_TIMEOUT_SECONDS=${LINGXIGRAPH_MODEL_TIMEOUT_SECONDS:-90}
      - PORT=8124
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]

  lingxiloop:
    build:
      context: .
      dockerfile: server/docker/lingxiloop-server.Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lingxigraph-runtime:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5181
      - DATABASE_URL=postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      - REDIS_URL=redis://redis:6379
      - AGENT_RUNTIME_SECRET=${AGENT_RUNTIME_SECRET:?AGENT_RUNTIME_SECRET is required in .env — generate with openssl rand -hex 32}

      # Model/provider configuration.
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_MODEL
      - OPENAI_MODEL_SUPPORT
      - OPENAI_COMPACTION_MODEL
      - OPENAI_IMAGE_MODEL

      # Web production origin / OAuth. Bare-name passthrough means values stay
      # unset unless configured in .env; server defaults remain intact for dev.
      - LINGXILOOP_PUBLIC_ORIGIN
      - LINGXILOOP_AUTH_DONE_URL
      - LINGXILOOP_AUTH_RETURN_ALLOWLIST
      - LINGXILOOP_INVITE_BASE_URL
      - LINGXILOOP_CORS_ORIGINS
      # Primary Web OIDC provider (Logto Traditional Web confidential client).
      - LINGXI_IDENTITY_ISSUER
      - LINGXI_IDENTITY_CLIENT_ID
      - LINGXI_IDENTITY_CLIENT_SECRET
      - LINGXI_IDENTITY_SCOPES
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET

      # Public upload/object-storage configuration. Local mode is persisted by
      # the named volume below; R2/S3 can be enabled by setting all core R2 vars.
      - PUBLIC_HOST
      - R2_ENDPOINT
      - R2_BUCKET
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_PUBLIC_BASE
      - R2_URL_SIGNING_SECRET
      - R2_URL_TTL_SECONDS

      # Optional integrations useful to the Web/server deployment.
      - SKILLHUB_URL
      - RESEND_API_KEY
      - EMAIL_DOMAIN
      - EMAIL_INBOUND_HMAC_SECRET

      # MVP-fixed reasoning + dispatch mode.
      - LINGXILOOP_REASONING_RUNTIME=lingxigraph
      - LINGXILOOP_MANAGED_AGENT_EXECUTION=server
      - LINGXIGRAPH_URL=http://lingxigraph-runtime:8124
        # Local compose uses LingxiGraph's controlled X-Tenant-ID dev auth.
    ports:
      # Safe default for same-host Caddy/Nginx. Override only when an external
      # load balancer/network explicitly needs to reach the container port.
      - "${LINGXILOOP_BIND_ADDRESS:-127.0.0.1}:${LINGXILOOP_PORT:-5181}:5181"
    volumes:
      - lingxiloop-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp]

networks:
  lingxiloop-mvp: {}

volumes:
  lingxiloop-postgres-data: {}
  lingxiloop-uploads: {}
