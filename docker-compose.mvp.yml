# MVP single-server deployment. Every LingxiLoop component is pulled from
# GitHub Container Registry; this file never builds application images.

x-quiet-logging: &quiet-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    pull_policy: always
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_min_error_statement=error"]
    environment:
      POSTGRES_USER: lingxiloop
      POSTGRES_PASSWORD: lingxiloop
      POSTGRES_DB: lingxiloop
    volumes:
      - lingxiloop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxiloop -d lingxiloop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    pull_policy: always
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - lingxiloop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  surrealdb:
    image: surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011
    pull_policy: always
    restart: unless-stopped
    command: ["start", "--log", "warn", "--user", "${OPEN_NOTEBOOK_SURREAL_USER:-open-notebook}", "--pass", "${OPEN_NOTEBOOK_SURREAL_PASSWORD:-open-notebook-dev}", "rocksdb:/data/open-notebook.db"]
    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"
    volumes:
      - open-notebook-surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [lingxiloop-knowledge-internal]
    logging: *quiet-logging

  open-notebook:
    build:
      context: ./third_party/open-notebook
      target: runtime
    restart: unless-stopped
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-lingxiloop-local-open-notebook-key}
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:-lingxiloop-local-open-notebook-password}
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-5}
      OPEN_NOTEBOOK_R2_ENABLED: ${OPEN_NOTEBOOK_R2_ENABLED:-auto}
      OPEN_NOTEBOOK_R2_PREFIX: ${OPEN_NOTEBOOK_R2_PREFIX:-open-notebook}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${OPEN_NOTEBOOK_SURREAL_USER:-open-notebook}
      SURREAL_PASSWORD: ${OPEN_NOTEBOOK_SURREAL_PASSWORD:-open-notebook-dev}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
    volumes:
      - open-notebook-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5055/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [lingxiloop-knowledge-internal, lingxiloop-knowledge-egress]
    logging: *quiet-logging

  wukongim:
    image: ${GHCR_ACCELERATOR:-accel.way2api.fun/ghcr.io}/lingxi-org/lingxiloop-wukongim:${LINGXILOOP_IMAGE_TAG:-mvp}
    pull_policy: always
    restart: unless-stopped
    environment:
      WK_NODE_DATA_DIR: /var/lib/wukongim
    volumes:
      - lingxiloop-wukong-data:/var/lib/wukongim
    ports:
      - "${WUKONG_WS_BIND_ADDRESS:-0.0.0.0}:${WUKONG_WS_PORT:-5200}:5200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  db-bootstrap:
    image: ${GHCR_ACCELERATOR:-accel.way2api.fun/ghcr.io}/lingxi-org/lingxiloop-server:${LINGXILOOP_IMAGE_TAG:-mvp}
    pull_policy: always
    profiles: [tools]
    restart: "no"
    command: ["npm", "run", "db:bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required in .env}
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

  lingxiloop:
    image: ${GHCR_ACCELERATOR:-accel.way2api.fun/ghcr.io}/lingxi-org/lingxiloop-server:${LINGXILOOP_IMAGE_TAG:-mvp}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      open-notebook:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: ${LINGXILOOP_LOG_LEVEL:-warn}
      PORT: 5181
      DATABASE_URL: postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      REDIS_URL: redis://redis:6379
      AGENT_OS_SERVICE_TOKEN: ${AGENT_OS_SERVICE_TOKEN:?AGENT_OS_SERVICE_TOKEN is required in .env}
      WUKONG_API_URL: http://wukongim:5001
      WUKONG_WS_URL: ${WUKONG_WS_URL:-ws://localhost:5200}
      WUKONG_API_TOKEN: ${WUKONG_API_TOKEN:-dev-wukong-api-token}
      WUKONG_WEBHOOK_SECRET: ${WUKONG_WEBHOOK_SECRET:-dev-wukong-webhook-secret}
      WUKONG_USER_TOKEN_SECRET: ${WUKONG_USER_TOKEN_SECRET:?WUKONG_USER_TOKEN_SECRET is required in .env}
      WUKONG_WEBHOOK_ALLOW_UNSIGNED_INTERNAL: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required in .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_EMBEDDING_MODEL: ${DEEPSEEK_EMBEDDING_MODEL:-}
      DEEPSEEK_IMAGE_MODEL: ${DEEPSEEK_IMAGE_MODEL:-}
      LINGXILOOP_PUBLIC_ORIGIN: ${LINGXILOOP_PUBLIC_ORIGIN:-http://localhost:5181}
      LINGXILOOP_AUTH_DONE_URL: ${LINGXILOOP_AUTH_DONE_URL:-http://localhost:5181/}
      LINGXILOOP_AUTH_RETURN_ALLOWLIST: ${LINGXILOOP_AUTH_RETURN_ALLOWLIST:-}
      LINGXILOOP_INVITE_BASE_URL: ${LINGXILOOP_INVITE_BASE_URL:-}
      LINGXILOOP_CORS_ORIGINS: ${LINGXILOOP_CORS_ORIGINS:-}
      LINGXI_IDENTITY_ISSUER: ${LINGXI_IDENTITY_ISSUER:-}
      LINGXI_IDENTITY_CLIENT_ID: ${LINGXI_IDENTITY_CLIENT_ID:-}
      LINGXI_IDENTITY_CLIENT_SECRET: ${LINGXI_IDENTITY_CLIENT_SECRET:-}
      LINGXI_IDENTITY_SCOPES: ${LINGXI_IDENTITY_SCOPES:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE: ${R2_PUBLIC_BASE:-}
      R2_URL_SIGNING_SECRET: ${R2_URL_SIGNING_SECRET:-}
      R2_URL_TTL_SECONDS: ${R2_URL_TTL_SECONDS:-}
      SKILLHUB_URL: ${SKILLHUB_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-}
      EMAIL_INBOUND_HMAC_SECRET: ${EMAIL_INBOUND_HMAC_SECRET:-}
      OPEN_NOTEBOOK_ENABLED: ${OPEN_NOTEBOOK_ENABLED:-true}
      OPEN_NOTEBOOK_URL: http://open-notebook:5055
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:-lingxiloop-local-open-notebook-password}
      OPEN_NOTEBOOK_CHAT_MODEL: ${OPEN_NOTEBOOK_CHAT_MODEL:-}
      OPEN_NOTEBOOK_STRATEGY_MODEL: ${OPEN_NOTEBOOK_STRATEGY_MODEL:-}
      OPEN_NOTEBOOK_ANSWER_MODEL: ${OPEN_NOTEBOOK_ANSWER_MODEL:-}
      OPEN_NOTEBOOK_FINAL_ANSWER_MODEL: ${OPEN_NOTEBOOK_FINAL_ANSWER_MODEL:-}
    ports:
      # Public by default so the mobile client can reach the API backend.
      - "${LINGXILOOP_BIND_ADDRESS:-0.0.0.0}:${LINGXILOOP_PORT:-5181}:5181"
    volumes:
      - lingxiloop-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp, lingxiloop-knowledge-internal]
    logging: *quiet-logging

  agent-os:
    image: ${GHCR_ACCELERATOR:-accel.way2api.fun/ghcr.io}/lingxi-org/lingxiloop-agent-os:${LINGXILOOP_IMAGE_TAG:-mvp}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      lingxiloop:
        condition: service_healthy
      wukongim:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: ${LINGXILOOP_LOG_LEVEL:-warn}
      AGENT_OS_PORT: 5190
      AGENT_OS_MAX_CONCURRENT_RUNS: ${AGENT_OS_MAX_CONCURRENT_RUNS:-8}
      AGENT_OS_SERVICE_TOKEN: ${AGENT_OS_SERVICE_TOKEN:?AGENT_OS_SERVICE_TOKEN is required in .env}
      LINGXILOOP_CONTROL_PLANE_URL: http://lingxiloop:5181
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required in .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AGENT_OS_HOMES_ROOT: /var/lib/lingxiloop-agent-os/homes
    volumes:
      - lingxiloop-agent-os-data:/var/lib/lingxiloop-agent-os
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5190/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp]
    logging: *quiet-logging

networks:
  lingxiloop-mvp: {}
  lingxiloop-knowledge-internal:
    internal: true
  lingxiloop-knowledge-egress: {}

volumes:
  lingxiloop-postgres-data: {}
  lingxiloop-redis-data: {}
  lingxiloop-uploads: {}
  lingxiloop-wukong-data: {}
  lingxiloop-agent-os-data: {}
  open-notebook-surreal-data: {}
  open-notebook-data: {}
