# MVP single-server Docker Compose deployment.
#
# Browser -> lingxiloop (SPA + API + WebSocket) -> Postgres / Redis
#                                             -> LingxiGraph Runtime
#
# Web/server mode only: one LingxiLoop replica, no Kubernetes/per-Agent Pod.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingxiloop
      POSTGRES_PASSWORD: lingxiloop
      POSTGRES_DB: lingxiloop
    volumes:
      - lingxiloop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxiloop -d lingxiloop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [lingxiloop-mvp]

  lingxigraph-runtime:
    build:
      context: .
      dockerfile: server/docker/lingxigraph-runtime.Dockerfile
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - LINGXIGRAPH_TOKEN
      - LINGXIGRAPH_MODEL_TIMEOUT_SECONDS=${LINGXIGRAPH_MODEL_TIMEOUT_SECONDS:-90}
      - PORT=8124
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [lingxiloop-mvp]

  lingxiloop:
    build:
      context: .
      dockerfile: server/docker/cumora-server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lingxigraph-runtime:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5181
      - DATABASE_URL=postgres://lingxiloop:lingxiloop@postgres:5432/lingxiloop
      - REDIS_URL=redis://redis:6379
      - AGENT_RUNTIME_SECRET=${AGENT_RUNTIME_SECRET:?AGENT_RUNTIME_SECRET is required in .env — generate with openssl rand -hex 32}

      # Model/provider configuration.
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_MODEL
      - OPENAI_MODEL_SUPPORT
      - OPENAI_COMPACTION_MODEL
      - OPENAI_IMAGE_MODEL

      # Web production origin / OAuth. Bare-name passthrough means values stay
      # unset unless configured in .env; server defaults remain intact for dev.
      - CUMORA_PUBLIC_ORIGIN
      - CUMORA_AUTH_DONE_URL
      - CUMORA_AUTH_RETURN_ALLOWLIST
      - CUMORA_INVITE_BASE_URL
      - CUMORA_CORS_ORIGINS
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET

      # Public upload/object-storage configuration. Local mode is persisted by
      # the named volume below; R2/S3 can be enabled by setting all core R2 vars.
      - PUBLIC_HOST
      - R2_ENDPOINT
      - R2_BUCKET
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_PUBLIC_BASE
      - R2_URL_SIGNING_SECRET
      - R2_URL_TTL_SECONDS

      # Optional integrations useful to the Web/server deployment.
      - SKILLHUB_URL
      - RESEND_API_KEY
      - EMAIL_DOMAIN
      - EMAIL_INBOUND_HMAC_SECRET

      # MVP-fixed reasoning + dispatch mode.
      - LINGXILOOP_REASONING_RUNTIME=lingxigraph
      - LINGXILOOP_MANAGED_AGENT_EXECUTION=server
      - LINGXIGRAPH_URL=http://lingxigraph-runtime:8124
      - LINGXIGRAPH_TOKEN
    ports:
      # Safe default for same-host Caddy/Nginx. Override only when an external
      # load balancer/network explicitly needs to reach the container port.
      - "${LINGXILOOP_BIND_ADDRESS:-127.0.0.1}:${LINGXILOOP_PORT:-5181}:5181"
    volumes:
      - lingxiloop-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop-mvp]

networks:
  lingxiloop-mvp: {}

volumes:
  lingxiloop-postgres-data: {}
  lingxiloop-uploads: {}
