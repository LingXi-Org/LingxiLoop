[node]
id = 1
data_dir = "/var/lib/wukongim"

[cluster]
listen_addr = "0.0.0.0:7001"
id = "lingxiloop-im"
nodes = [{ id = 1, addr = "wukongim:7001" }]
join_token = "change-with-WK_CLUSTER_JOIN_TOKEN"
initial_slot_count = 10
hash_slot_count = 256
slot_replica_n = 1

[api]
listen_addr = "0.0.0.0:5001"
external_tcp_addr = "wukongim:5100"
external_ws_addr = "ws://wukongim:5200"

[manager]
listen_addr = "127.0.0.1:5301"
# Manager is bound to the container loopback and is not part of the product
# surface. Production operations use an authenticated, private deployment
# endpoint supplied by the operator rather than this embedded UI.
auth_on = false

[bench]
api_enable = false

[observability]
metrics_enable = true
debug_api_enable = false

[top]
api_enable = false

[diagnostics]
enable = true
sample_rate = 0.01
slow_threshold_ms = 500

[log]
level = "warn"
dir = "/var/lib/wukongim/logs"
console = true
format = "console"

[gateway]
listeners = [
  { name = "tcp-wkproto", network = "tcp", address = "0.0.0.0:5100", transport = "gnet", protocol = "wkproto" },
  { name = "ws-gateway", network = "websocket", address = "0.0.0.0:5200", transport = "gnet", protocol = "wsmux" }
]

[message]
person_whitelist_enabled = false

[delivery]
enable = true

[webhook]
http_addr = "http://lingxiloop:5181/webhooks/wukong"
focus_events = ["msg.notify"]
queue_size = 1024
workers = 8
msg_notify_batch_max_items = 1
request_timeout = "5s"
retry_max_attempts = 8

[plugin]
enable = false
