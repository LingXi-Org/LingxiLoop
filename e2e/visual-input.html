<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>合成输入和阅读验收</title></head><body><div id="root"></div><script>window.addEventListener('error', event => { const p=document.createElement('pre'); p.textContent=event.message; document.body.append(p); });window.addEventListener('unhandledrejection', event => { const p=document.createElement('pre'); p.textContent=String(event.reason); document.body.append(p); });</script><script type="module" src="/e2e/visual-input.tsx"></script></body></html>
