<div id="visualize-acceptance">
  <div class="nav nav-pills" role="tablist" aria-label="Fixture views">
    <button class="nav-link active" id="design-tab" role="tab" aria-controls="design-panel" aria-selected="true" type="button">Design</button>
    <button class="nav-link" id="data-tab" role="tab" aria-controls="data-panel" aria-selected="false" type="button">Data</button>
  </div>
  <div id="design-panel" role="tabpanel" aria-labelledby="design-tab">
    <div class="viz-carousel viz-dotted-background" aria-label="Player designs">
      <section data-variant="Compact" aria-label="Compact design">
        <div id="fixture-player" aria-label="Player settings">
          <h2>Field recordings</h2><p id="fixture-track">Rain in the garden</p>
          <button id="fixture-play" type="button" data-tooltip="Toggle local playback"><i data-lucide="play" aria-hidden="true"></i><span id="fixture-play-label">Pause</span></button>
          <output id="fixture-render" aria-label="Rendered design"></output>
          <button id="fixture-count" type="button">Saved count: 5</button>
          <button id="fixture-expand-content" type="button">Show detail</button>
          <p id="fixture-detail" hidden>Rain, wind, birds, and distant water.</p>
        </div>
      </section>
      <section data-variant="Editorial" aria-label="Editorial design" hidden>
        <div id="fixture-editorial" aria-label="Editorial settings"><h2>Sounds from the field</h2><button id="fixture-editorial-count" type="button">Local count: 0</button><output id="fixture-editorial-render"></output></div>
      </section>
    </div>
    <div class="d-flex gap-2"><button id="fixture-follow-up" class="btn" type="button">Explain saved count</button><a class="btn" href="https://example.com/visualize-acceptance" rel="noopener noreferrer">Reference</a></div>
    <p id="fixture-status" role="status"></p>
  </div>
  <div id="data-panel" role="tabpanel" aria-labelledby="data-tab" hidden>
    <svg id="fixture-chart" role="img" aria-label="D3 values 2, 4 and 6" viewBox="0 0 480 120"></svg>
    <div id="fixture-calendar"></div>
    <output id="fixture-calendar-selection"></output>
  </div>
</div>
<style>
#fixture-player,#fixture-editorial { box-sizing:border-box; min-height:260px; background:light-dark(#f4f3f7,#25242b); color:light-dark(#26232e,#efedf4); padding:24px; }
#fixture-player h2,#fixture-editorial h2 { font-size:22px; margin:0 0 12px; }
#fixture-player button,#fixture-editorial button { border:1px solid light-dark(#d0cdd7,#625c6c); color:inherit; background:transparent; padding:8px 12px; border-radius:8px; margin:4px; }
#fixture-player #fixture-play { background:var(--player-accent); color:#fff; }
#fixture-player output,#fixture-editorial output { display:block; margin:12px 0; }
#visualize-acceptance .viz-carousel > section { min-height:320px; padding:20px; }
#fixture-chart { width:100%; height:120px; }
#fixture-detail { min-height:80px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
{
  const root = document.getElementById('visualize-acceptance');
  const player = document.getElementById('fixture-player');
  const state = { radius:18, accent:'#7c3aed', playing:true, density:'normal' };
  const editorialState = { spacing:24 };
  let localCount = 0;
  let count = 5;
  function render() {
    player.style.borderRadius = `${state.radius}px`;
    player.style.setProperty('--player-accent', state.accent);
    player.style.padding = state.density === 'compact' ? '12px' : '24px';
    document.getElementById('fixture-play-label').textContent = state.playing ? 'Pause' : 'Play';
    document.getElementById('fixture-render').textContent = `radius=${state.radius}; accent=${state.accent}; playing=${state.playing}; density=${state.density}`;
  }
  function restore() {
    const saved = window.zcode?.widgetState?.modelContent?.count;
    count = typeof saved === 'number' ? saved : 5;
    document.getElementById('fixture-count').textContent = `Saved count: ${count}`;
  }
  function renderEditorial() {
    document.getElementById('fixture-editorial').style.padding = `${editorialState.spacing}px`;
    document.getElementById('fixture-editorial-render').textContent = `spacing=${editorialState.spacing}`;
  }
  render(); renderEditorial(); restore();
  window.addEventListener('zcode:set_globals', restore);
  document.getElementById('fixture-count').onclick = async () => {
    count++;
    document.getElementById('fixture-count').textContent = `Saved count: ${count}`;
    try { await window.zcode.setWidgetState({modelContent:{count},privateContent:{selected:'rain'}}); document.getElementById('fixture-status').textContent='Saved'; }
    catch { document.getElementById('fixture-status').textContent='Save failed'; }
  };
  document.getElementById('fixture-editorial-count').onclick = event => { event.currentTarget.textContent = `Local count: ${++localCount}`; };
  document.getElementById('fixture-play').onclick = () => { state.playing=!state.playing; render(); };
  document.getElementById('fixture-expand-content').onclick = () => { document.getElementById('fixture-detail').hidden = !document.getElementById('fixture-detail').hidden; };
  document.getElementById('fixture-follow-up').onclick = async () => {
    try { await window.zcode.sendFollowUpMessage({prompt:`Explain saved count ${count}`,title:'Count explorer'}); document.getElementById('fixture-status').textContent='Follow-up accepted'; }
    catch { document.getElementById('fixture-status').textContent='Follow-up rejected'; }
  };
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:player,onChange:render});
    tweak.addSlider(state,'radius',{label:'Corner radius',min:0,max:40,unit:'px'});
    tweak.addColorPicker(state,'accent',{label:'Accent',reference:'--player-accent'});
    tweak.addToggle(state,'playing',{label:'Playing'});
    tweak.addSelect(state,'density',{label:'Density',options:[{label:'Comfortable',value:'normal'},{label:'Compact',value:'compact'}]});
    new Tweak({container:document.getElementById('fixture-editorial'),onChange:renderEditorial}).addSlider(editorialState,'spacing',{label:'Editorial spacing',min:8,max:40});
  }
  d3.select('#fixture-chart').selectAll('rect').data([2,4,6]).join('rect').attr('x',(_,i)=>i*150+15).attr('y',d=>120-d*15).attr('width',100).attr('height',d=>d*15).attr('fill','var(--viz-series-1)');
  const calendar = document.createElement('viz-calendar');
  calendar.setAttribute('date','2026-09-08'); calendar.setAttribute('start','11:00'); calendar.setAttribute('end','14:00'); calendar.setAttribute('interactive','');
  calendar.events = [{title:'Standup',start:'12:00',end:'12:30'},{title:'Design sync',start:'13:00',end:'14:00',video:true}];
  calendar.addEventListener('eventselect',event=>{document.getElementById('fixture-calendar-selection').textContent=event.detail.event.title;});
  document.getElementById('fixture-calendar').append(calendar);
  root.dataset.fixtureReady='true';
}
</script>
