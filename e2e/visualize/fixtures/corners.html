<style>
  #corner-surface { position: relative; width: 100%; height: 220px; background: #cbd5e1; color: #0f172a; }
  #corner-surface .corner { position: absolute; width: 12px; height: 12px; margin: 0; padding: 0; border: 0; border-radius: 0; min-width: 0; min-height: 0; }
  #corner-tl { top: 0; left: 0; background: #ef4444; }
  #corner-tr { top: 0; right: 0; background: #22c55e; }
  #corner-bl { bottom: 0; left: 0; background: #3b82f6; }
  #corner-br { bottom: 0; right: 0; background: #eab308; }
  #corner-body { position: absolute; inset: 32px; }
</style>
<section id="corner-surface" aria-label="Square content bounds">
  <span id="corner-tl" class="corner"></span>
  <span id="corner-tr" class="corner"></span>
  <span id="corner-bl" class="corner"></span>
  <span id="corner-br" class="corner"></span>
  <div id="corner-body">
    <p>Every colored square must retain its outer corner.</p>
    <button id="corner-counter" type="button">Local count: 0</button>
  </div>
</section>
<script>
(() => {
  const surface = document.getElementById('corner-surface');
  const counter = document.getElementById('corner-counter');
  let count = 0;
  counter.onclick = () => { counter.textContent = `Local count: ${++count}`; };
  const measure = () => {
    const rect = surface.getBoundingClientRect();
    surface.dataset.bounds = JSON.stringify({ x: rect.x, y: rect.y, width: rect.width, height: rect.height });
  };
  new ResizeObserver(measure).observe(surface);
  measure();
})();
</script>
