<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualize acceptance</title></head><body><div id="root"></div><script>for(const kind of ["error","unhandledrejection"])addEventListener(kind,event=>{const output=document.createElement("pre");output.setAttribute("data-bootstrap-error","");output.textContent=String(event.error?.stack||event.reason?.stack||event.message||event.reason);document.body.append(output)})</script><script type="module" src="/e2e/visualize/index.tsx"></script></body></html>
