name: lingxiloop-e2e-knowledge
services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: ["start", "--log", "warn", "memory"]
    environment:
      SURREAL_USER: lingxiloop-e2e
      SURREAL_PASS: lingxiloop-e2e-surreal-local
    ports:
      - "127.0.0.1:58001:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 2s
      timeout: 3s
      retries: 30
