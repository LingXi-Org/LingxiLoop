name: lingxiloop-spa352
services:
  postgres:
    image: pgvector/pgvector:pg16
    labels: { lingxiloop.acceptance: spa352 }
    ports: ["127.0.0.1:55433:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lingxiloop-e2e-local
      POSTGRES_DB: lingxiloop_browser_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lingxiloop_browser_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  wukongim:
    image: ${E2E_WUKONG_IMAGE:-lingxiloop-cloud-wukongim:c7f663fa23a4}
    ports: ["127.0.0.1:55002:5001", "127.0.0.1:55201:5200"]
    environment:
      WK_WEBHOOK_HTTP_ADDR: http://host.docker.internal:5281/webhooks/wukong?token=lingxiloop-e2e-webhook
    extra_hosts: ["host.docker.internal:host-gateway"]
  storage:
    image: ${E2E_STORAGE_IMAGE:-lingxiloop-cloud-minio:20250907}
    command: ["server", "/data"]
    ports: ["127.0.0.1:59001:9000"]
    environment:
      MINIO_ROOT_USER: lingxiloop-e2e
      MINIO_ROOT_PASSWORD: lingxiloop-e2e-storage-local
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5280
