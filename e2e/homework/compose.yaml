name: lingxiloop-homework-live
services:
  wukongim:
    image: ${E2E_WUKONG_IMAGE:-lingxiloop-e2e-wukongim:local}
    build:
      context: ../..
      dockerfile: server/docker/wukongim.Dockerfile
      args:
        WUKONG_COMMIT: c7f663fa23a4ee2c6f7e08c68423f50f0f6e9c47
    ports:
      - "127.0.0.1:55021:5001"
      - "127.0.0.1:55220:5200"
    environment:
      WK_WEBHOOK_HTTP_ADDR: http://host.docker.internal:53196/webhooks/wukong?token=lingxiloop-homework-live-webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: homework-e2e
      MINIO_ROOT_PASSWORD: homework-e2e-local-storage
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:53198
    ports:
      - "127.0.0.1:59020:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
