name: lingxiloop-app-b-native324

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime: &runtime
  image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-server:ac56ac633fbd7737923f27f84157ea47cf1cc681
  pull_policy: always
  restart: unless-stopped
  environment: &runtime-environment
    NODE_ENV: production
    NODE_OPTIONS: --max-old-space-size=320
    LINGXILOOP_LOG_LEVEL: ${LINGXILOOP_LOG_LEVEL:-warn}
    PORT: "5181"
    INSTANCE_ID: ${INSTANCE_ID:?INSTANCE_ID is required}
    DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    WUKONG_API_URL: ${WUKONG_API_URL:?WUKONG_API_URL is required}
    WUKONG_WS_URL: ${WUKONG_WS_PUBLIC_URL:?WUKONG_WS_PUBLIC_URL is required}
    WUKONG_API_TOKEN: ${WUKONG_API_TOKEN:?WUKONG_API_TOKEN is required}
    WUKONG_WEBHOOK_SECRET: ${WUKONG_WEBHOOK_SECRET:?WUKONG_WEBHOOK_SECRET is required}
    WUKONG_USER_TOKEN_SECRET: ${WUKONG_USER_TOKEN_SECRET:?WUKONG_USER_TOKEN_SECRET is required}
    OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
    AGENT_OS_HOMES_ROOT: /var/lib/lingxios/homes
    AGENT_OS_PYTHON: /usr/bin/python3
    AGENT_OS_MAX_CONCURRENT_RUNS: ${AGENT_OS_MAX_CONCURRENT_RUNS:-2}
    AGENT_OS_MAX_MODEL_CALLS: ${AGENT_OS_MAX_MODEL_CALLS:-128}
    AGENT_OS_MAX_MODEL_TOKENS: ${AGENT_OS_MAX_MODEL_TOKENS:-1000000}
    AGENT_OS_MAX_MODEL_COST_MICROS: ${AGENT_OS_MAX_MODEL_COST_MICROS:-10000000}
    AGENT_OS_MAX_WORK_MS: ${AGENT_OS_MAX_WORK_MS:-1800000}
    AGENT_OS_INPUT_COST_MICROS_PER_MILLION: ${AGENT_OS_INPUT_COST_MICROS_PER_MILLION:?AGENT_OS_INPUT_COST_MICROS_PER_MILLION is required}
    AGENT_OS_OUTPUT_COST_MICROS_PER_MILLION: ${AGENT_OS_OUTPUT_COST_MICROS_PER_MILLION:?AGENT_OS_OUTPUT_COST_MICROS_PER_MILLION is required}
    LINGXIOS_CONTAINER_ISOLATED: "true"
    SILICONFLOW_USD_CNY_RATE: ${SILICONFLOW_USD_CNY_RATE:?SILICONFLOW_USD_CNY_RATE is required}
    LINGXIOS_SERVICE_TOKEN: ${LINGXIOS_SERVICE_TOKEN:?LINGXIOS_SERVICE_TOKEN is required}
    LINGXIOS_CONTROL_HOST: 0.0.0.0
    LINGXIOS_CONTROL_URL: http://lingxiloop:5182
    OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
    OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
    OTEL_DEPLOYMENT_ENVIRONMENT: production
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    LINGXILIT_PRICING_JSON: ${LINGXILIT_PRICING_JSON:-}
    LINGXILOOP_PUBLIC_ORIGIN: ${LINGXILOOP_PUBLIC_ORIGIN:?LINGXILOOP_PUBLIC_ORIGIN is required}
    LINGXILOOP_INVITE_BASE_URL: ${LINGXILOOP_INVITE_BASE_URL:?LINGXILOOP_INVITE_BASE_URL is required}
    LINGXILOOP_CORS_ORIGINS: ${LINGXILOOP_CORS_ORIGINS:?LINGXILOOP_CORS_ORIGINS is required}
    LINGXILOOP_GATEWAY_HMAC_SECRET: ${LINGXILOOP_GATEWAY_HMAC_SECRET:?LINGXILOOP_GATEWAY_HMAC_SECRET is required}
    R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
    R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
    R2_PUBLIC_BASE: ${R2_PUBLIC_BASE:?R2_PUBLIC_BASE is required}
    R2_URL_SIGNING_SECRET: ${R2_URL_SIGNING_SECRET:?R2_URL_SIGNING_SECRET is required}
    R2_URL_TTL_SECONDS: ${R2_URL_TTL_SECONDS:-3600}
    OPEN_NOTEBOOK_ENABLED: "true"
    OPEN_NOTEBOOK_URL: ${OPEN_NOTEBOOK_URL:?OPEN_NOTEBOOK_URL is required}
    OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?OPEN_NOTEBOOK_PASSWORD is required}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    EMAIL_DOMAIN: ${EMAIL_DOMAIN:-}
    METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    PRESENTATION_HTML_ENABLED: ${PRESENTATION_HTML_ENABLED:-false}
  logging: *logging

services:
  db-migrate:
    <<: *runtime
    environment:
      NODE_ENV: production
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: on-failure
    command: ["npm", "run", "db:migrate"]
    cpus: "0.5"
    mem_limit: 512m

  lingxiloop:
    <<: *runtime
    environment: *runtime-environment
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5183:5181"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    cpus: "0.75"
    mem_limit: 448m

  worker:
    <<: *runtime
    environment: *runtime-environment
    command: ["npm", "run", "worker:start"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - lingxios-homes:/var/lib/lingxios/homes
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["seccomp=unconfined", "systempaths=unconfined"]
    pids_limit: 128
    cpus: "0.75"
    mem_limit: 512m

  gateway-native324:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-gateway:4d807eac5e285a90a03999d2f476817059c11099
    pull_policy: always
    restart: unless-stopped
    depends_on:
      lingxiloop:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 5s
    cpus: "0.25"
    mem_limit: 64m
    logging: *logging
    networks: [default, ingress]

volumes:
  lingxios-homes: {}

networks:
  ingress:
    external: true
    name: lingxiloop-ingress
