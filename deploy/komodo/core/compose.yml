name: komodo

services:
  mongo:
    image: accel.way2api.fun/docker.io/library/mongo:8.0.32@sha256:6c108efd306c66a7eb58e0b4042c2fcffb4a4980dac111039c59fd714db6a69b
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:?KOMODO_DATABASE_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?KOMODO_DATABASE_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    labels:
      komodo.skip: ""

  core:
    image: accel.way2api.fun/ghcr.io/moghtech/komodo-core:2.3.3@sha256:bca73d0eee143066228fb9b80c38a5a2726e573ad2758f7aa92b5c91a8aef1c7
    init: true
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      KOMODO_HOST: https://ops.christmas1314.xyz
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:?KOMODO_DATABASE_USERNAME is required}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD:?KOMODO_DATABASE_PASSWORD is required}
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_ENABLE_NEW_USERS: "false"
      KOMODO_INIT_ADMIN_USERNAME: admin
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_ADMIN_PASSWORD:?KOMODO_ADMIN_PASSWORD is required}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET:?KOMODO_JWT_SECRET is required}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET:?KOMODO_WEBHOOK_SECRET is required}
      KOMODO_TIMEZONE: Asia/Shanghai
    volumes:
      - keys:/config/keys
      - /etc/komodo/backups:/backups
    ports:
      - 127.0.0.1:9120:9120

volumes:
  mongo-data: {}
  mongo-config: {}
  keys: {}
