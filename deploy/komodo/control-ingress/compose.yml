name: control-ingress

services:
  traefik:
    image: accel.way2api.fun/docker.io/library/traefik:v3.7.1
    container_name: komodo-traefik
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=WARN
      - --accesslog=true
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./dynamic.yml:/etc/traefik/dynamic/routes.yml:ro
      - traefik-acme:/letsencrypt
    networks: [komodo]
    restart: unless-stopped

volumes:
  traefik-acme:
    external: true
    name: control-ingress_traefik-acme

networks:
  komodo:
    external: true
    name: komodo_default
