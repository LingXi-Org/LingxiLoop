# Shared Komodo scope after controller handoff. No controller-owned stacks or release Procedure.
# Historical rollback source remains in resources.toml and immutable Git history.

[[stack]]
name = "server-b-ingress"
deploy = true
[stack.config]
server = "shanghai-b"
repo = "LingXi-Org/LingxiLoop"
branch = "main"
# Includes the exact backend router accepted by the fixed bootstrap actor.
commit = "816433430c71887905bf277d6ced523cc92f6674"
git_provider = "accel.way2api.fun/github.com"
run_directory = "deploy/komodo/server-b-ingress"
file_paths = ["compose.yml"]
environment = "ACME_EMAIL = [[ACME_EMAIL]]"

[[stack]]
name = "landing"
deploy = true
after = ["server-b-ingress"]
[stack.config]
server = "shanghai-b"
repo = "lyyzka/lingxiloop-landing-page"
branch = "main"
git_provider = "accel.way2api.fun/github.com"
git_account = "lyyzka"
registry_provider = "ghcr.io"
registry_account = "lyyzka"
run_directory = "deploy/komodo"
file_paths = ["compose.yml"]

[[stack]]
name = "lingxilit"
deploy = true
after = ["server-b-ingress"]
[stack.config]
server = "shanghai-b"
repo = "lyyzka/LingxiLit"
branch = "main"
git_provider = "accel.way2api.fun/github.com"
run_directory = "deploy/komodo"
file_paths = ["compose.yml"]

[[stack]]
name = "uptime"
deploy = true
after = ["server-b-ingress"]
[stack.config]
server = "shanghai-b"
repo = "LingXi-Org/LingxiLoop"
branch = "main"
git_provider = "accel.way2api.fun/github.com"
run_directory = "deploy/komodo/uptime"
file_paths = ["compose.yml"]
