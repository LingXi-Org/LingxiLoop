# Immutable local policy; import only nodes from a secret provider file.
# No subscription URL or credential belongs in Git. Never replace this policy with a subscription document.
mixed-port: 17890
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: warning
external-controller: ''
ipv6: false
proxy-providers:
  subscribed-nodes:
    type: file
    path: /run/credentials/lingxi-release-mihomo.service/provider.yaml
proxy-groups:
  - name: RELEASE-EGRESS
    type: select
    use:
      - subscribed-nodes
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ghcr.io,RELEASE-EGRESS
  - DOMAIN-SUFFIX,github.com,RELEASE-EGRESS
  - DOMAIN-SUFFIX,githubusercontent.com,RELEASE-EGRESS
  - DOMAIN-SUFFIX,githubassets.com,RELEASE-EGRESS
  - DOMAIN-SUFFIX,docker.io,RELEASE-EGRESS
  - DOMAIN-SUFFIX,docker.com,RELEASE-EGRESS
  - DOMAIN-SUFFIX,cloudflarestorage.com,RELEASE-EGRESS
  - MATCH,DIRECT
