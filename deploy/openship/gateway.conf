map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream lingxiloop_web {
    zone lingxiloop_web 64k;
    least_conn;
    server lingxiloop:5181 resolve max_fails=2 fail_timeout=5s;
    server 10.20.0.2:5181 max_fails=2 fail_timeout=5s;
}

upstream control_plane {
    zone control_plane 64k;
    server admin.lingxilearn.cn:443 resolve;
    keepalive 32;
}

server {
    listen 8080 default_server;
    server_name lingxilearn.cn www.lingxilearn.cn;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

server {
    listen 8080;
    server_name loop.lingxilearn.cn;

    location /api/ {
        error_page 418 = @origin_api;
        if ($http_x_lingxiloop_gateway != "") {
            return 418;
        }

        proxy_pass https://control_plane;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name admin.lingxilearn.cn;
        proxy_set_header Connection "";
        proxy_set_header Host admin.lingxilearn.cn;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @origin_api {
        proxy_pass http://lingxiloop_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location / {
        proxy_pass http://lingxiloop_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 8080;
    server_name im.lingxilearn.cn;

    location / {
        proxy_pass http://10.20.0.2:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
