<div class="viz" style="font-family:system-ui,Segoe UI,Microsoft YaHei,sans-serif;max-width:860px;color:#1c2733">
<style>
.viz *{box-sizing:border-box}
.viz .tabs{display:flex;gap:.5rem;margin:.5rem 0}
.viz .tabs button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:.35rem .8rem;cursor:pointer;font-size:.9rem}
.viz .tabs button.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.viz table{border-collapse:collapse;width:100%;font-size:.85rem;margin-top:.4rem}
.viz th,.viz td{border:1px solid #d8dee6;padding:.28rem .5rem;text-align:center}
.viz th{background:#f1f5f9}
.viz .hi{background:#fef9c3;font-weight:600}
.viz .lo{background:#fee2e2;color:#b91c1c;font-weight:600}
.viz .note{font-size:.85rem;color:#475569;margin-top:.5rem}
.viz svg text{font-size:11px;fill:#475569}
</style>
<div class="tabs">
<button class="on" id="btnA" onclick="setTab('A')">销售额与成本</button>
<button id="btnB" onclick="setTab('B')">利润及其月度变化</button>
</div>
<div id="panelA">
<svg id="svgA" width="820" height="345" viewBox="0 0 820 345"></svg>
<table id="tabA"></table>
<div class="note">单位：万元。销售额整体上行，唯一回落是第 3 月（18→17，−1）；成本同步上升但更平缓，两条线的张口逐月变大，毛利空间在扩大。</div>
</div>
<div id="panelB" style="display:none">
<svg id="svgB" width="820" height="345" viewBox="0 0 820 345"></svg>
<table id="tabB"></table>
<div class="note">利润 = 销售额 − 成本（万元）。变化最快的月份：<b>第 6 月</b>——利润单月增加最多（+6 万元，14→20），销售额单月增加也最多（+9 万元，31→40）。唯一一次回落出现在第 3 月（利润 −2 万元，销售额 −1 万元），其余月份均为增长。</div>
</div>
<script>
(function(){
var M=['第1月','第2月','第3月','第4月','第5月','第6月'];
var rev=[12,18,17,25,31,40], cost=[8,11,12,15,17,20];
var profit=rev.map((v,i)=>v-cost[i]);           // 4,7,5,10,14,20
var dP=profit.slice(1).map((v,i)=>v-profit[i]); // 3,-2,5,4,6
var dR=rev.slice(1).map((v,i)=>v-rev[i]);       // 6,-1,8,6,9
var maxAbsP=dP.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a);
var maxAbsR=dR.reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a);
var colors={rev:'#1d4ed8',cost:'#dc2626',profit:'#047857',bar:'#94a3b8',barNeg:'#dc2626'};
function table(el,head,rows,hiCell){var h='<tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
 rows.forEach((r,ri)=>{h+='<tr>'+r.map((c,ci)=>'<td'+(hiCell&&hiCell(ri,ci)?' class="hi"':(c<0?' class="lo"':''))+'>'+c+'</td>').join('')+'</tr>'});el.innerHTML=h;}
function axes(svg,x0,x1,ymin,ymax,step){var ns='http://www.w3.org/2000/svg';
 var L=60,R=790,T=30,B=295;function X(i){return x0+(x1-x0)*i/(M.length-1);}
 function Y(v){return B-(B-T)*(v-ymin)/(ymax-ymin);}
 var mk=(t,a)=>{var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;};
 mk('line',{x1:L,y1:B,x2:R,y2:B,stroke:'#94a3b8'});mk('line',{x1:L,y1:T,x2:L,y2:B,stroke:'#94a3b8'});
 for(var v=Math.ceil(ymin);v<=ymax;v+=step){mk('line',{x1:L,y1:Y(v),x2:R,y2:Y(v),stroke:'#e2e8f0'});
  mk('text',{x:L-8,y:Y(v)+4,'text-anchor':'end'}).textContent=v;}
 M.forEach((m,i)=>{var t=mk('text',{x:X(i),y:B+18,'text-anchor':'middle'});t.textContent=m;});
 return {X:X,Y:Y,mk:mk};}
/* Panel A */
var gA=axes(document.getElementById('svgA'),100,760,5,45,5);
function path(vals,g){return vals.map((v,i)=>(i?'L':'M')+g.X(i).toFixed(1)+' '+g.Y(v).toFixed(1)).join(' ');}
gA.mk('path',{d:path(rev,gA),fill:'none',stroke:colors.rev,'stroke-width':2.5});
gA.mk('path',{d:path(cost,gA),fill:'none',stroke:colors.cost,'stroke-width':2.5,'stroke-dasharray':'6 4'});
rev.forEach((v,i)=>gA.mk('circle',{cx:gA.X(i),cy:gA.Y(v),r:4,fill:colors.rev}));
cost.forEach((v,i)=>gA.mk('circle',{cx:gA.X(i),cy:gA.Y(v),r:4,fill:colors.cost}));
var lg=gA.mk('text',{x:180,y:48});lg.textContent='— 销售额';lg.style.fill=colors.rev;lg.setAttribute('font-weight','600');
var lg2=gA.mk('text',{x:270,y:48});lg2.textContent='- - 成本';lg2.style.fill=colors.cost;lg2.setAttribute('font-weight','600');
rev.forEach((v,i)=>{var t=gA.mk('text',{x:gA.X(i),y:gA.Y(v)-9,'text-anchor':'middle'});t.textContent=v;t.style.fill=colors.rev;t.setAttribute('font-weight','600');});
cost.forEach((v,i)=>{if(i===0||i===5){var t=gA.mk('text',{x:gA.X(i)+14,y:gA.Y(v)+4});t.textContent=v;t.style.fill=colors.cost;}});
table(document.getElementById('tabA'),['项目'].concat(M),
 [['销售额'].concat(rev),['成本'].concat(cost),['单月销售额变化','—'].concat(dR.map(d=>(d>0?'+':'')+d))],
 (r,c)=>r===2&&c>0&&Math.abs(dR[c-1])===Math.abs(maxAbsR));
/* Panel B */
var gB=axes(document.getElementById('svgB'),100,760,0,22,2);
gB.mk('path',{d:path(profit,gB),fill:'none',stroke:colors.profit,'stroke-width':2.5});
profit.forEach((v,i)=>{gB.mk('circle',{cx:gB.X(i),cy:gB.Y(v),r:4,fill:colors.profit});
 var t=gB.mk('text',{x:gB.X(i),y:gB.Y(v)-10,'text-anchor':'middle'});t.textContent=v;t.setAttribute('font-weight','600');});
gB.mk('rect',{x:gB.X(5)-8,y:gB.Y(20)-8,width:16,height:16,fill:'none',stroke:'#f59e0b','stroke-width':2});
for(var i=1;i<6;i++){var d=profit[i]-profit[i-1],x=(gB.X(i-1)+gB.X(i))/2;
 gB.mk('rect',{x:x-10,y:308-Math.abs(d)*6,width:20,height:Math.abs(d)*6,fill:d<0?colors.barNeg:colors.bar});
 var t=gB.mk('text',{x:x,y:308-Math.abs(d)*6-5,'text-anchor':'middle'});t.textContent=(d>0?'+':'')+d;}
var l3=document.getElementById('svgB').ownerDocument.createElementNS('http://www.w3.org/2000/svg','text');
l3.setAttribute('x',70);l3.setAttribute('y',335);l3.textContent='下方矮柱 = 利润的月度变化（万元）';
document.getElementById('svgB').appendChild(l3);
table(document.getElementById('tabB'),['项目'].concat(M),
 [['利润'].concat(profit),['利润月度变化','—'].concat(dP.map(d=>(d>0?'+':'')+d))],
 (r,c)=>r===1&&c>0&&Math.abs(dP[c-1])===Math.abs(maxAbsP));
window.setTab=function(t){['A','B'].forEach(k=>{document.getElementById('panel'+k).style.display=k===t?'':'none';});
 document.getElementById('btnA').className=t==='A'?'on':'';document.getElementById('btnB').className=t==='B'?'on':'';};
})();
</script>
</div>
