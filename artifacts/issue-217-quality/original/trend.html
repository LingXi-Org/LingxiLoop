<div style="font-family:system-ui,sans-serif;max-width:760px;color:#1f2937">
  <svg id="chart" width="720" height="380"></svg>
  <svg id="bars" width="720" height="200"></svg>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    const months=["1月","2月","3月","4月","5月","6月"];
    const sales=[12,18,17,25,31,40], cost=[8,11,12,15,17,20];
    const profit=sales.map((s,i)=>s-cost[i]);
    const diff=profit.map((p,i)=>i?p-sales[i-1]:null);
    const salesDiff=sales.map((s,i)=>i?s-sales[i-1]:null);

    function axes(svg,w,h,margin,yMax,yLabel){
      const x=d3.scalePoint().domain(months).range([margin.left,w-margin.right]);
      const y=d3.scaleLinear().domain([0,yMax]).range([h-margin.bottom,margin.top]);
      svg.append("g").attr("transform",`translate(0,${h-margin.bottom})`).call(d3.axisBottom(x));
      svg.append("g").attr("transform",`translate(${margin.left},0)`).call(d3.axisLeft(y));
      svg.append("text").attr("x",6).attr("y",14).text(yLabel).attr("font-size",12).attr("fill","#6b7280");
      return {x,y};
    }
    const m={top:20,right:20,bottom:30,left:40};
    const s1=d3.select("#chart"), h1=380;
    const {x,y}=axes(s1,720,h1,m,45,"万元");
    const line=(val)=>d3.line().x((d,i)=>x(months[i])).y((d,i)=>y(d))(val);
    s1.append("path").datum(cost).attr("fill","none").attr("stroke","#9ca3af").attr("stroke-width",2).attr("stroke-dasharray","5 4").attr("d",line);
    s1.append("path").datum(sales).attr("fill","none").attr("stroke","#2563eb").attr("stroke-width",3).attr("d",line);
    s1.append("path").datum(profit).attr("fill","none").attr("stroke","#dc2626").attr("stroke-width",3).attr("d",line);
    [[profit,"#dc2626"],[sales,"#2563eb"],[cost,"#9ca3af"]].forEach(([val,c])=>{
      s1.selectAll(null).data(val).enter().append("circle")
        .attr("cx",(d,i)=>x(months[i])).attr("cy",d=>y(d)).attr("r",4).attr("fill",c);
    });
    s1.selectAll(null).data(profit).enter().append("text")
      .attr("x",(d,i)=>x(months[i])).attr("y",d=>y(d)-10).attr("text-anchor","middle").attr("font-size",12).attr("fill","#dc2626").text(d=>d);
    const leg=[["销售额","#2563eb"],["成本","#9ca3af"],["利润","#dc2626"]];
    leg.forEach(([t,c],i)=>{ s1.append("circle").attr("cx",100+i*90).attr("cy",12).attr("r",5).attr("fill",c);
      s1.append("text").attr("x",110+i*90).attr("y",16).text(t).attr("font-size",12).attr("fill","#374151"); });

    const s2=d3.select("#bars"), h2=200;
    const y2=d3.scaleLinear().domain([0,d3.max(diff)]).range([h2-30,20]);
    s2.selectAll(null).data(diff).enter().append("rect")
      .attr("x",(d,i)=>x(months[i])-18).attr("y",d=>d==null?0:y2(d))
      .attr("width",36).attr("height",d=>d==null?0:h2-30-y2(d))
      .attr("fill",(d,i)=>i===diff.length-1?"#dc2626":"#f87171");
    s2.selectAll(null).data(diff).enter().append("text")
      .attr("x",(d,i)=>x(months[i])).attr("y",d=>d==null?10:y2(d)-4).attr("text-anchor","middle")
      .attr("font-size",12).attr("fill","#374151").text(d=>d==null?"":"+"+d);
    s2.append("g").attr("transform",`translate(0,${h2-30})`).call(d3.axisBottom(x).tickSize(0)).call(g=>g.select(".domain").remove());
    s2.append("text").attr("x",0).attr("y",14).text("利润环比变化（万元）").attr("font-size",12).attr("fill","#6b7280");
  </script>
</div>
