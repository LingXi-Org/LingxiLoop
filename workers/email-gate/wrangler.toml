# Cloudflare Email Worker — agent inbox front door.
#
# Receives every inbound email for *.<EMAIL_DOMAIN> via Cloudflare Email
# Routing. Parses raw MIME with `postal-mime`, builds a JSON payload,
# HMAC-signs it with EMAIL_INBOUND_HMAC_SECRET (shared with lingxiloop-server),
# and POSTs to <LINGXILOOP_INBOUND_URL>. The server resolves recipients to
# agents, writes messages + email_messages, and wakes the agent pods.
#
# Setup (one-time per environment):
#   1. cd workers/email-gate && npm install
#   2. npx wrangler login
#   3. Open Cloudflare dashboard → your zone → Email → Email Routing
#      • Enable Email Routing
#      • Catch-all address: route to "Send to a Worker" → lingxiloop-email-gate
#   4. npx wrangler deploy
#   5. npx wrangler secret put EMAIL_INBOUND_HMAC_SECRET
#      (paste the same value as the server's .env)
#
# DNS: Email Routing inserts the MX records for the apex zone automatically
# when you enable it. Tenants are encoded into the local-part of the address
# (`<participantId>.<companySlug>@<EMAIL_DOMAIN>`) so the apex MX is the
# only DNS setup needed — no per-tenant subdomain MX work.
#
# Outbound goes through Resend (server-side), NOT this worker.

name = "lingxiloop-email-gate"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Example only. This Worker is retained as source and is not deployed by CI.
# Set these values explicitly before a manual deployment.
[vars]
LINGXILOOP_INBOUND_URL = "https://loop.example.com/webhooks/email/inbound"
# Comma-separated list of root domains we accept mail for. The worker
# rejects (with 550) any RCPT outside this list, so we don't relay
# random misdirected mail to the lingxiloop server.
EMAIL_ROOT_DOMAINS = "mail.loop.example.com"

# EMAIL_INBOUND_HMAC_SECRET is set via:
#   npx wrangler secret put EMAIL_INBOUND_HMAC_SECRET
