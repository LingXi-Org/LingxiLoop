name: lingxiloop-review-knowledge-20261019
services:
  surrealdb:
    image: surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011
    user: "0:0"
    command: ["start", "--log", "warn", "rocksdb:/data/knowledge.db"]
    environment:
      SURREAL_USER: lingxiloop-e2e
      SURREAL_PASS: lingxiloop-e2e-surreal-local
    volumes: ["surreal-data:/data"]
    networks: [isolated]
    ports: ["127.0.0.1:18001:8000"]
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: ${CASE_TEST_MINIO_IMAGE:-lingxiloop-cloud-minio:20250907}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: lingxiloop-e2e
      MINIO_ROOT_PASSWORD: lingxiloop-e2e-storage-local
    volumes: ["object-data:/data"]
    networks: [isolated]
    ports: ["127.0.0.1:19000:9000"]
  embeddings:
    image: accel.way2api.fun/ghcr.io/lingxi-org/lingxiloop-open-notebook:c132e9f20b3df1873792618ed3f3bfe8be2be00e@sha256:3079e66373006c38539a14646e4d3b2ec0d4feeade92346ed855293b8c53f4ca
    command: ["/app/.venv/bin/python", "/fixture/embeddings.py"]
    volumes: ["./embeddings.py:/fixture/embeddings.py:ro"]
    networks: [isolated]
    ports: ["127.0.0.1:18056:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
  open-notebook:
    image: accel.way2api.fun/ghcr.io/lingxi-org/lingxiloop-open-notebook:c132e9f20b3df1873792618ed3f3bfe8be2be00e@sha256:3079e66373006c38539a14646e4d3b2ec0d4feeade92346ed855293b8c53f4ca
    depends_on:
      surrealdb: {condition: service_healthy}
      embeddings: {condition: service_healthy}
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: lingxiloop-e2e
      SURREAL_PASSWORD: lingxiloop-e2e-surreal-local
      SURREAL_NAMESPACE: lingxiloop_e2e
      SURREAL_DATABASE: lingxiloop_e2e
      OPEN_NOTEBOOK_PASSWORD: lingxiloop-e2e-notebook-local
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: "1"
      OPEN_NOTEBOOK_R2_ENABLED: "true"
      OPEN_NOTEBOOK_R2_PREFIX: open-notebook-e2e
      R2_ENDPOINT: http://storage:9000
      R2_BUCKET: lingxiloop-e2e
      R2_ACCESS_KEY_ID: lingxiloop-e2e
      R2_SECRET_ACCESS_KEY: lingxiloop-e2e-storage-local
      OPENAI_API_KEY: lingxiloop-e2e-embedding-local
      OPENAI_BASE_URL: http://embeddings:8000/v1
      OPENAI_EMBEDDING_MODEL: e2e-constant-vector-1024
    volumes: ["notebook-data:/app/data"]
    networks: [isolated]
    ports: ["127.0.0.1:18055:5055"]
networks:
  isolated: {internal: true}
volumes:
  surreal-data: {}
  object-data: {}
  notebook-data: {}
