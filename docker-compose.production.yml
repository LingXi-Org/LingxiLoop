name: lingxiloop

x-quiet-logging: &quiet-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Agent execution is owned by the independently scalable Agent OS work queue.
# CI supplies .release.env with digest-pinned image references and public,
# release-specific metadata. Operators pre-provision .env.secrets; CI never
# creates or overwrites that file.

x-lingxiloop-runtime: &lingxiloop-runtime
  image: ${LINGXILOOP_SERVER_IMAGE:?LINGXILOOP_SERVER_IMAGE must be digest-pinned}
  env_file:
    - ./.env.secrets
  environment: &lingxiloop-environment
    NODE_ENV: production
    LINGXILOOP_LOG_LEVEL: warn
    PORT: "5181"
    REDIS_URL: redis://redis:6379
    LINGXILOOP_VERSION: ${LINGXILOOP_VERSION:?LINGXILOOP_VERSION is required}
    LINGXILOOP_COMMIT_SHA: ${LINGXILOOP_COMMIT_SHA:?LINGXILOOP_COMMIT_SHA is required}
    LINGXILOOP_PUBLIC_ORIGIN: ${LINGXILOOP_PUBLIC_ORIGIN:?LINGXILOOP_PUBLIC_ORIGIN is required}
    WUKONG_API_URL: http://wukongim:5001
    WUKONG_WS_URL: ${WUKONG_WS_PUBLIC_URL:?WUKONG_WS_PUBLIC_URL is required}
    WUKONG_WEBHOOK_ALLOW_UNSIGNED_INTERNAL: "true"
    LINGXILOOP_CORS_ORIGINS: app://lingxiloop
    LINGXILOOP_AUTH_RETURN_ALLOWLIST: ${LINGXILOOP_PUBLIC_ORIGIN}/,http://127.0.0.1:47823/auth/done,lingxiloop://auth
  networks: [lingxiloop]

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_min_error_statement=error"]
    env_file:
      - ./.env.secrets
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lingxiloop} -d $${POSTGRES_DB:-lingxiloop}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [lingxiloop]

  wukongim:
    image: ${WUKONGIM_IMAGE:?WUKONGIM_IMAGE must pin v3 commit c7f663fa23a4ee2c6f7e08c68423f50f0f6e9c47 by digest}
    restart: unless-stopped
    env_file:
      - ./.env.secrets
    environment:
      WK_NODE_DATA_DIR: /var/lib/wukongim
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/readyz"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - wukong-data:/var/lib/wukongim
    ports:
      - "127.0.0.1:5200:5200"
    networks: [lingxiloop]
    logging: *quiet-logging

  migrate:
    <<: *lingxiloop-runtime
    profiles: [tools]
    restart: "no"
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  lingxiloop:
    <<: *lingxiloop-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
    ports:
      - "127.0.0.1:5181:5181"
    volumes:
      - uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *quiet-logging

  agent-os:
    image: ${AGENT_OS_IMAGE:?AGENT_OS_IMAGE must be digest-pinned}
    restart: unless-stopped
    env_file:
      - ./.env.secrets
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: warn
      AGENT_OS_PORT: "5190"
      AGENT_OS_MAX_CONCURRENT_RUNS: ${AGENT_OS_MAX_CONCURRENT_RUNS:-4}
      LINGXILOOP_CONTROL_PLANE_URL: http://lingxiloop:5181
      AGENT_OS_HOMES_ROOT: /var/lib/lingxiloop-agent-os/homes
    depends_on:
      lingxiloop:
        condition: service_healthy
      wukongim:
        condition: service_healthy
    volumes:
      - agent-os-data:/var/lib/lingxiloop-agent-os
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5190/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [lingxiloop]
    logging: *quiet-logging

networks:
  lingxiloop: {}

volumes:
  postgres-data: {}
  redis-data: {}
  uploads: {}
  wukong-data: {}
  agent-os-data: {}
