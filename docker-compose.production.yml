name: lingxiloop

x-quiet-logging: &quiet-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Agent execution is owned by the independently scalable Agent OS work queue.
# CI pins every project image to its release commit. Operators pre-provision
# .env.secrets; CI never creates or overwrites that file.

x-lingxiloop-runtime: &lingxiloop-runtime
  image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-server:b42fef160fe697d46a8818e054f945d1f80953f7
  pull_policy: always
  env_file:
    - ./.env.secrets
  environment: &lingxiloop-environment
    NODE_ENV: production
    LINGXILOOP_LOG_LEVEL: warn
    PORT: "5181"
    REDIS_URL: redis://redis:6379
    OTEL_DEPLOYMENT_ENVIRONMENT: production
    LINGXILOOP_PUBLIC_ORIGIN: ${LINGXILOOP_PUBLIC_ORIGIN:?LINGXILOOP_PUBLIC_ORIGIN is required}
    WUKONG_API_URL: http://wukongim:5001
    WUKONG_WS_URL: ${WUKONG_WS_PUBLIC_URL:?WUKONG_WS_PUBLIC_URL is required}
    LINGXILOOP_CORS_ORIGINS: ${LINGXILOOP_CORS_ORIGINS:?LINGXILOOP_CORS_ORIGINS is required}
    LINGXILOOP_GATEWAY_HMAC_SECRET: ${LINGXILOOP_GATEWAY_HMAC_SECRET:?gateway HMAC secret is required}
    OPEN_NOTEBOOK_ENABLED: "true"
    OPEN_NOTEBOOK_URL: http://open-notebook:5055
    PRESENTATION_HTML_ENABLED: ${PRESENTATION_HTML_ENABLED:-false}
  networks: [lingxiloop]

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_messages=warning", "-c", "log_min_error_statement=error"]
    env_file:
      - ./.env.secrets
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lingxiloop} -d $${POSTGRES_DB:-lingxiloop}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [lingxiloop]

  surrealdb:
    image: surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011
    restart: unless-stopped
    command: ["start", "--log", "warn", "rocksdb:/data/open-notebook.db"]
    environment:
      SURREAL_USER: open-notebook
      SURREAL_PASS: ${OPEN_NOTEBOOK_SURREAL_PASSWORD:?OPEN_NOTEBOOK_SURREAL_PASSWORD is required}
    volumes:
      - open-notebook-surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [lingxiloop-knowledge-internal]
    logging: *quiet-logging

  open-notebook:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-open-notebook:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: open-notebook
      SURREAL_PASSWORD: ${OPEN_NOTEBOOK_SURREAL_PASSWORD:?OPEN_NOTEBOOK_SURREAL_PASSWORD is required}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?OPEN_NOTEBOOK_PASSWORD is required}
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-1}
      OPEN_NOTEBOOK_R2_PREFIX: ${OPEN_NOTEBOOK_R2_PREFIX:-open-notebook}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      OPENAI_API_KEY: ${OPEN_NOTEBOOK_PASSWORD:?OPEN_NOTEBOOK_PASSWORD is required}
      OPENAI_BASE_URL: http://lingxiloop:5181/internal/open-notebook/v1
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
    volumes:
      - open-notebook-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status rag-api | grep -q RUNNING && supervisorctl status rag-worker | grep -q RUNNING && curl -fsS http://localhost:5055/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [lingxiloop-knowledge-internal, lingxiloop-knowledge-egress]
    logging: *quiet-logging

  wukongim:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-wukongim:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./.env.secrets
    environment:
      WK_NODE_DATA_DIR: /var/lib/wukongim
      WK_WEBHOOK_HTTP_ADDR: "http://lingxiloop:5181/webhooks/wukong?token=${WUKONG_WEBHOOK_SECRET:?WUKONG_WEBHOOK_SECRET is required}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/readyz"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - wukong-data:/var/lib/wukongim
    ports:
      - "127.0.0.1:5200:5200"
    networks: [lingxiloop]
    logging: *quiet-logging

  db-migrate:
    <<: *lingxiloop-runtime
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Deployment-only reconciler. When R2 is configured, deploy-production.sh
  # runs this before the application cutover and the script reads the bucket
  # policy back, failing the deployment if required Web PUT origins are absent.
  r2-cors:
    <<: *lingxiloop-runtime
    profiles: [tools]
    restart: "no"
    command: ["node", "server/scripts/r2-cors.mjs"]

  lingxiloop:
    <<: *lingxiloop-runtime
    environment:
      <<: *lingxiloop-environment
      OTEL_SERVICE_NAME: lingxiloop-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      open-notebook:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5181:5181"
    networks: [lingxiloop, lingxiloop-knowledge-internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *quiet-logging

  worker:
    <<: *lingxiloop-runtime
    environment:
      <<: *lingxiloop-environment
      OTEL_SERVICE_NAME: lingxiloop-worker
    restart: unless-stopped
    command: ["npm", "run", "worker:start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wukongim:
        condition: service_healthy
      open-notebook:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [lingxiloop, lingxiloop-knowledge-internal]
    logging: *quiet-logging

  agent-os:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-agent-os:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ./.env.secrets
    environment:
      NODE_ENV: production
      LINGXILOOP_LOG_LEVEL: warn
      OTEL_SERVICE_NAME: lingxiloop-agent-os
      OTEL_DEPLOYMENT_ENVIRONMENT: production
      AGENT_OS_PORT: "5190"
      AGENT_OS_MAX_CONCURRENT_RUNS: ${AGENT_OS_MAX_CONCURRENT_RUNS:-2}
      LINGXILOOP_CONTROL_PLANE_URL: http://lingxiloop:5181
      AGENT_OS_HOMES_ROOT: /var/lib/lingxiloop-agent-os/homes
    depends_on:
      lingxiloop:
        condition: service_healthy
      wukongim:
        condition: service_healthy
    volumes:
      - agent-os-data:/var/lib/lingxiloop-agent-os
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5190/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [lingxiloop]
    logging: *quiet-logging

networks:
  lingxiloop: {}
  lingxiloop-knowledge-internal:
    internal: true
  lingxiloop-knowledge-egress: {}

volumes:
  postgres-data: {}
  redis-data: {}
  wukong-data: {}
  agent-os-data: {}
  open-notebook-surreal-data: {}
  open-notebook-data: {}
