name: lingxiloop

x-quiet-logging: &quiet-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# PostgreSQL and Redis intentionally live on the private database server.
# Application images are assembled from immutable GHCR digests only.
x-runtime: &runtime
  image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-server:b42fef160fe697d46a8818e054f945d1f80953f7
  pull_policy: always
  environment: &runtime-environment
    NODE_ENV: production
    PORT: "5181"
    LINGXILOOP_LOG_LEVEL: ${LINGXILOOP_LOG_LEVEL:-warn}
    LINGXILOOP_VERSION: ${LINGXILOOP_VERSION:?LINGXILOOP_VERSION is required}
    LINGXILOOP_COMMIT_SHA: ${LINGXILOOP_COMMIT_SHA:?LINGXILOOP_COMMIT_SHA is required}
    DATABASE_URL: ${DATABASE_URL:?private DATABASE_URL is required}
    REDIS_URL: ${REDIS_URL:?private REDIS_URL is required}
    AGENT_OS_NODE_TIMEOUT_SECONDS: ${AGENT_OS_NODE_TIMEOUT_SECONDS:-15}
    AGENT_OS_SERVICE_TOKEN: ${AGENT_OS_SERVICE_TOKEN:?AGENT_OS_SERVICE_TOKEN is required}
    WUKONG_API_URL: http://wukongim:5001
    WUKONG_WS_URL: ${WUKONG_WS_PUBLIC_URL:?WUKONG_WS_PUBLIC_URL is required}
    WUKONG_API_TOKEN: ${WUKONG_API_TOKEN:?WUKONG_API_TOKEN is required}
    WUKONG_WEBHOOK_SECRET: ${WUKONG_WEBHOOK_SECRET:?WUKONG_WEBHOOK_SECRET is required}
    WUKONG_USER_TOKEN_SECRET: ${WUKONG_USER_TOKEN_SECRET:?WUKONG_USER_TOKEN_SECRET is required}
    OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
    OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    OTEL_SERVICE_NAME: lingxiloop-web
    OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
    LINGXILIT_PRICING_JSON: ${LINGXILIT_PRICING_JSON:-}
    LINGXILOOP_PUBLIC_ORIGIN: ${LINGXILOOP_PUBLIC_ORIGIN:?LINGXILOOP_PUBLIC_ORIGIN is required}
    LINGXILOOP_GATEWAY_HMAC_SECRET: ${LINGXILOOP_GATEWAY_HMAC_SECRET:?gateway HMAC secret is required}
    LINGXILOOP_INVITE_BASE_URL: ${LINGXILOOP_INVITE_BASE_URL:?LINGXILOOP_INVITE_BASE_URL is required}
    LINGXILOOP_CORS_ORIGINS: ${LINGXILOOP_CORS_ORIGINS:?admin origin is required}
    R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
    R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
    R2_PUBLIC_BASE: ${R2_PUBLIC_BASE:?R2_PUBLIC_BASE is required}
    R2_URL_SIGNING_SECRET: ${R2_URL_SIGNING_SECRET:?R2_URL_SIGNING_SECRET is required}
    R2_URL_TTL_SECONDS: ${R2_URL_TTL_SECONDS:-3600}
    OPEN_NOTEBOOK_ENABLED: "true"
    OPEN_NOTEBOOK_URL: http://open-notebook:5055
    OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?OPEN_NOTEBOOK_PASSWORD is required}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    EMAIL_DOMAIN: ${EMAIL_DOMAIN:-}
    METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    PRESENTATION_HTML_ENABLED: ${PRESENTATION_HTML_ENABLED:-false}
  networks: [lingxiloop, knowledge-internal]
  logging: *quiet-logging

services:
  surrealdb:
    image: surrealdb/surrealdb:v2@sha256:d653f6c8a89e81f865ee31cd2f587c50f50ace922175e04150b1e385d2f86011
    restart: unless-stopped
    command: ["start", "--log", "warn", "rocksdb:/data/open-notebook.db"]
    environment:
      SURREAL_USER: open-notebook
      SURREAL_PASS: ${OPEN_NOTEBOOK_SURREAL_PASSWORD:?OPEN_NOTEBOOK_SURREAL_PASSWORD is required}
    volumes: [open-notebook-surreal-data:/data]
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [knowledge-internal]
    logging: *quiet-logging

  open-notebook:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-open-notebook:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    depends_on:
      surrealdb: { condition: service_healthy }
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: open-notebook
      SURREAL_PASSWORD: ${OPEN_NOTEBOOK_SURREAL_PASSWORD:?OPEN_NOTEBOOK_SURREAL_PASSWORD is required}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:?OPEN_NOTEBOOK_PASSWORD is required}
      OPEN_NOTEBOOK_WORKER_MAX_TASKS: ${OPEN_NOTEBOOK_WORKER_MAX_TASKS:-5}
      OPEN_NOTEBOOK_R2_ENABLED: "true"
      OPEN_NOTEBOOK_R2_PREFIX: ${OPEN_NOTEBOOK_R2_PREFIX:-open-notebook}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      OPENAI_API_KEY: ${OPEN_NOTEBOOK_PASSWORD:?OPEN_NOTEBOOK_PASSWORD is required}
      OPENAI_BASE_URL: http://lingxiloop:5181/internal/open-notebook/v1
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
    volumes: [open-notebook-data:/app/data]
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status rag-api | grep -q RUNNING && supervisorctl status rag-worker | grep -q RUNNING && curl -fsS http://localhost:5055/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [knowledge-internal, knowledge-egress]
    logging: *quiet-logging

  wukongim:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-wukongim:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    environment:
      WK_NODE_DATA_DIR: /var/lib/wukongim
      WK_WEBHOOK_HTTP_ADDR: "http://lingxiloop:5181/webhooks/wukong?token=${WUKONG_WEBHOOK_SECRET:?WUKONG_WEBHOOK_SECRET is required}"
    volumes: [wukong-data:/var/lib/wukongim]
    ports: ["5200:5200"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5001/readyz"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [lingxiloop]
    logging: *quiet-logging

  db-migrate:
    <<: *runtime
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    networks: [lingxiloop]

  lingxiloop:
    <<: *runtime
    restart: unless-stopped
    depends_on:
      wukongim: { condition: service_healthy }
      open-notebook: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    ports: ["5181:5181"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5181/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *runtime
    environment:
      <<: *runtime-environment
      OTEL_SERVICE_NAME: lingxiloop-worker
    restart: unless-stopped
    command: ["npm", "run", "worker:start"]
    depends_on:
      wukongim: { condition: service_healthy }
      open-notebook: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
      lingxiloop: { condition: service_healthy }

  agent-os:
    image: accel.way2api.fun/ghcr.io/lyyzka/lingxiloop-agent-os:b42fef160fe697d46a8818e054f945d1f80953f7
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AGENT_OS_PORT: "5190"
      AGENT_OS_MAX_CONCURRENT_RUNS: ${AGENT_OS_MAX_CONCURRENT_RUNS:-8}
      AGENT_OS_SERVICE_TOKEN: ${AGENT_OS_SERVICE_TOKEN:?AGENT_OS_SERVICE_TOKEN is required}
      LINGXILOOP_CONTROL_PLANE_URL: http://lingxiloop:5181
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:?OPENAI_EMBEDDING_MODEL is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: lingxiloop-agent-os
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
      LINGXILIT_PRICING_JSON: ${LINGXILIT_PRICING_JSON:-}
      AGENT_OS_HOMES_ROOT: /var/lib/lingxiloop-agent-os/homes
    depends_on:
      lingxiloop: { condition: service_healthy }
      wukongim: { condition: service_healthy }
    volumes: [agent-os-data:/var/lib/lingxiloop-agent-os]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5190/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [lingxiloop]
    logging: *quiet-logging

networks:
  lingxiloop: {}
  knowledge-internal: { internal: true }
  knowledge-egress: {}

volumes:
  wukong-data: {}
  agent-os-data: {}
  open-notebook-surreal-data: {}
  open-notebook-data: {}
